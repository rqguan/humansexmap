<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   CONFIG
════════════════════════════════════════════════════════════════ */
const DATA   = 'sexmap_annotated_v7.json';
const SVG_W  = 2008;
const SVG_H  = 1920;
const VER    = 'v1.';

// LOD thresholds (world scale = zoom level)
const Z_RGN = 0.25;   // show region labels above this zoom
const Z_ENT = 0.72;   // show entry labels above this zoom
const Z_GEO = 1.10;   // show geo arc labels above this zoom
const Z_MIN = 0.15, Z_MAX = 14;

// Collision grid (world pixels per cell)
const CELL = 14;
const GW   = Math.ceil(SVG_W / CELL);
const GH   = Math.ceil(SVG_H / CELL);

// World-space font config
const RGN_FONT_SCALE = 1.65;  // fontSize (from JSON) × this = world px
const ENT_FONT       = 13;    // world px for entry labels
const GEO_FONT       = 14;    // world px for geo arc labels

/* ════════════════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════════════════ */
let items    = [];
let states   = null;
let lblEls   = [];
let geoFeats = [];
let selectedI = -1;

let zoom = 1, panX = 0, panY = 0;
let dragging = false, didMove = false;
let dragO = {x:0,y:0};
let rafPending = false;
let currentLOD = '';

/* ════════════════════════════════════════════════════════════════
   COORDINATE BUG FIX
   The v5 annotation tool had a double-export bug:
     stored = original_pct / SVG_W * 100  (applied 1 or 2 times)
   Detection: if stored * SVG_W² / 10000 > 100 → single corruption
              else → double corruption
════════════════════════════════════════════════════════════════ */
function fixEntryCoords(allRegions) {
  const FX2 = SVG_W * SVG_W / 10000;  // double-corruption multiplier for x (403.2)
  const FY2 = SVG_H * SVG_H / 10000;  // double-corruption multiplier for y (368.64)
  const FX1 = SVG_W / 100;            // single-corruption multiplier for x (20.08)
  const FY1 = SVG_H / 100;            // single-corruption multiplier for y (19.20)

  for (const r of allRegions) {
    for (const e of r.entries || []) {
      if (e.x == null) continue;
      if (e.x * FX2 > 100 || e.y * FY2 > 100) {
        // Single corruption: recover original percentage
        e.x = e.x * FX1;
        e.y = e.y * FY1;
      } else {
        // Double corruption: recover original percentage
        e.x = e.x * FX2;
        e.y = e.y * FY2;
      }
    }
  }
}

/* ════════════════════════════════════════════════════════════════
   POLYGON UTILITIES
════════════════════════════════════════════════════════════════ */
// Principal axis angle (degrees) of a polygon via covariance
function polyMajorAxis(pts) {
  const n  = pts.length;
  const cx = pts.reduce((s,p) => s + p.x, 0) / n;
  const cy = pts.reduce((s,p) => s + p.y, 0) / n;
  let ixx = 0, iyy = 0, ixy = 0;
  for (const p of pts) {
    const dx = p.x - cx, dy = p.y - cy;
    ixx += dx*dx; iyy += dy*dy; ixy += dx*dy;
  }
  if (ixx === iyy) return 0;
  return 0.5 * Math.atan2(2*ixy, ixx-iyy) * 180 / Math.PI;
}

// Snap to 0° (horizontal) or 90° (vertical)
function snapAngle(deg) {
  const a = ((deg % 180) + 180) % 180;
  return (a <= 45 || a >= 135) ? 0 : 90;
}

/* ════════════════════════════════════════════════════════════════
   BUILD ITEM LIST  ← ORDER FROZEN FOR SHARE LINKS
════════════════════════════════════════════════════════════════ */
function buildItems(d) {
  items = []; geoFeats = [];

  const allRgns = [...(d.regions||[]), ...(d.islands||[]), ...(d.warning_regions||[])];
  fixEntryCoords(allRgns); // repair coordinate bug before use

  // Geo features (display only, not interactive)
  for (const g of d.geographical_features || []) {
    if (g.x1 == null) continue;
    geoFeats.push({
      zh: g.zh, en: g.en,
      pts: [
        {x: g.x1/100*SVG_W, y: g.y1/100*SVG_H},
        {x: g.x2/100*SVG_W, y: g.y2/100*SVG_H},
        {x: g.x3/100*SVG_W, y: g.y3/100*SVG_H},
      ]
    });
  }

  for (const r of allRgns) {
    if (r.x == null) continue;

    // Use pre-calculated centroid if available, else annotated x/y
    const cx = (r.center?.x ?? r.x) / 100 * SVG_W;
    const cy = (r.center?.y ?? r.y) / 100 * SVG_H;

    // Polygon principal axis → snap to 0° or 90°
    const bnd   = r.boundary || [];
    const angle = bnd.length >= 3 ? snapAngle(polyMajorAxis(bnd)) : 0;
    const wFont = (r.fontSize || 13) * RGN_FONT_SCALE;

    items.push({
      zh: r.zh, en: r.en, role: 'region',
      ax: cx, ay: cy,
      wFont,          // world-px font size for this region
      labelAngle: angle,
      warn: !!(r.warning)
    });

    for (const e of r.entries || []) {
      if (e.x == null) continue;
      items.push({
        zh: e.zh, en: e.en, role: 'entry',
        ax: e.x / 100 * SVG_W,
        ay: e.y / 100 * SVG_H,
        wFont: ENT_FONT,
        labelAngle: 0,
        warn: !!(r.warning)
      });
    }
  }
}

/* ════════════════════════════════════════════════════════════════
   GEO LABELS — curved SVG text (world-space, no counter-scale)
════════════════════════════════════════════════════════════════ */
function buildGeoSVG() {
  const svg = G('geo-svg');
  svg.setAttribute('width',  SVG_W);
  svg.setAttribute('height', SVG_H);
  const NS = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(NS, 'defs');
  svg.appendChild(defs);

  geoFeats.forEach((g, i) => {
    const [p0, p1, p2] = g.pts;
    const cpx = 2*p1.x - 0.5*(p0.x+p2.x);
    const cpy = 2*p1.y - 0.5*(p0.y+p2.y);
    const D   = `M ${p0.x.toFixed(1)} ${p0.y.toFixed(1)} Q ${cpx.toFixed(1)} ${cpy.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;

    const pathEl = document.createElementNS(NS, 'path');
    pathEl.id = `gp${i}`; pathEl.setAttribute('d', D); pathEl.setAttribute('fill', 'none');
    defs.appendChild(pathEl);

    // White halo stroke beneath main text
    const mkText = (isHalo) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('font-size',    GEO_FONT);
      t.setAttribute('font-family',  'Noto Serif SC, STSong, Georgia, serif');
      t.setAttribute('font-weight',  '700');
      t.setAttribute('letter-spacing', '0.5');
      t.className.baseVal = 'geo-lod' + (isHalo ? ' geo-halo' : ' geo-fill');
      if (isHalo) {
        t.setAttribute('fill', 'none');
        t.setAttribute('stroke', 'rgba(255,255,255,.88)');
        t.setAttribute('stroke-width', '3');
        t.setAttribute('stroke-linejoin', 'round');
      } else {
        t.setAttribute('fill', '#120800');
        t.setAttribute('opacity', '.78');
      }
      const tp = document.createElementNS(NS, 'textPath');
      tp.setAttribute('href', `#gp${i}`);
      tp.setAttribute('startOffset', '50%');
      tp.setAttribute('text-anchor', 'middle');
      tp.textContent = g.zh;
      t.appendChild(tp);
      return t;
    };
    svg.appendChild(mkText(true));
    svg.appendChild(mkText(false));
  });
}

/* ════════════════════════════════════════════════════════════════
   LABEL PLACEMENT — grid collision avoidance with 0°/90° rotation
   Runs ONCE on load. Zero per-frame cost.
════════════════════════════════════════════════════════════════ */
function placeAndBuildLabels() {
  const grid = new Uint8Array(GW * GH);
  const PAD  = 4;

  function markGrid(cx, cy, W, H) {
    const x1 = Math.max(0, Math.floor((cx-W/2-PAD)/CELL));
    const y1 = Math.max(0, Math.floor((cy-H/2-PAD)/CELL));
    const x2 = Math.min(GW-1, Math.ceil((cx+W/2+PAD)/CELL));
    const y2 = Math.min(GH-1, Math.ceil((cy+H/2+PAD)/CELL));
    for (let r=y1; r<=y2; r++) for (let c=x1; c<=x2; c++) grid[r*GW+c] = 1;
  }
  function checkGrid(cx, cy, W, H) {
    const x1 = Math.max(0, Math.floor((cx-W/2-PAD)/CELL));
    const y1 = Math.max(0, Math.floor((cy-H/2-PAD)/CELL));
    const x2 = Math.min(GW-1, Math.ceil((cx+W/2+PAD)/CELL));
    const y2 = Math.min(GH-1, Math.ceil((cy+H/2+PAD)/CELL));
    for (let r=y1; r<=y2; r++) for (let c=x1; c<=x2; c++) if (grid[r*GW+c]) return true;
    return false;
  }
  function inBounds(cx, cy, W, H) {
    return cx-W/2 >= 0 && cx+W/2 <= SVG_W && cy-H/2 >= 0 && cy+H/2 <= SVG_H;
  }

  // Estimate label width from text (Chinese chars are ~1.05× font size wide)
  function estW(text, fs) {
    const zh = (text.match(/[\u4e00-\u9fff\u3000-\u303f]/g) || []).length;
    return zh * fs * 1.05 + (text.length - zh) * fs * 0.55 + 8;
  }

  const container = G('labels');
  container.style.width  = SVG_W + 'px';
  container.style.height = SVG_H + 'px';

  // Placement map
  const placements = new Map();

  // Regions first (higher priority in grid)
  const sortedItems = [
    ...items.filter(i => i.role === 'region'),
    ...items.filter(i => i.role === 'entry'),
  ];

  for (const item of sortedItems) {
    const fs  = item.wFont;
    const W   = estW(item.zh, fs);
    const H   = fs * 1.4;
    const ax  = item.ax, ay = item.ay;
    const G2  = 5; // gap world-px

    const isRgn = item.role === 'region';

    // Build candidate list:
    // Each candidate: [labelCenterX, labelCenterY, cssAngle]
    // For 0°: visual W×H. For 90°: visual H×W (W and H swapped in the grid).
    // CSS: element positioned at (cx-W/2, cy-H/2), transform rotate(-90deg) around 50% 50%
    const cands = isRgn ? buildRegionCands(ax, ay, W, H, G2, item.labelAngle)
                        : buildEntryCands(ax, ay, W, H, G2);

    let placed = false;
    for (const [lcx, lcy, angle] of cands) {
      // Grid check uses VISUAL bounding box (W/H swapped for 90°)
      const Wv = angle === 0 ? W : H;
      const Hv = angle === 0 ? H : W;
      if (!inBounds(lcx, lcy, Wv, Hv)) continue;
      if (!checkGrid(lcx, lcy, Wv, Hv)) {
        placements.set(item, {cx: lcx, cy: lcy, W, H, angle, hidden: false, fs});
        markGrid(lcx, lcy, Wv, Hv);
        placed = true;
        break;
      }
    }
    if (!placed) {
      // Force place at anchor (might overlap, but don't hide region labels)
      const angle = item.labelAngle;
      placements.set(item, {cx: ax, cy: ay, W, H, angle, hidden: isRgn ? false : true, fs});
      if (isRgn) markGrid(ax, ay, angle===0?W:H, angle===0?H:W);
    }
  }

  // Build DOM elements
  lblEls = items.map((item, i) => {
    const p   = placements.get(item);
    const el  = document.createElement('div');
    const cls = [
      'lbl',
      item.role === 'region' ? 'lbl-rgn' : 'lbl-ent',
      item.warn ? 'lbl-warn' : '',
      p.hidden  ? 'lbl-skip' : '',
    ].filter(Boolean).join(' ');
    el.className = cls;

    // Position so element center is at (p.cx, p.cy)
    // CSS element dimensions are W × H; rotation is applied via transform
    el.style.left          = (p.cx - p.W/2) + 'px';
    el.style.top           = (p.cy - p.H/2) + 'px';
    el.style.transformOrigin = '50% 50%';
    if (p.angle !== 0) el.style.transform = `rotate(${-p.angle}deg)`;

    el.dataset.s = String(states[i]);
    el.title     = item.en;

    const dot = document.createElement('div');
    dot.className = 'dot';

    const txt = document.createElement('span');
    txt.className = 'ltxt';
    txt.textContent = item.zh;
    txt.style.fontSize = p.fs + 'px';

    el.appendChild(dot);
    el.appendChild(txt);

    el.addEventListener('click', e => {
      e.stopPropagation();
      showPopup(e.clientX, e.clientY, i);
    });

    container.appendChild(el);
    return el;
  });
}

function buildRegionCands(ax, ay, W, H, G2, preferAngle) {
  // Regions: try preferred axis first, centered on centroid
  const other = preferAngle === 0 ? 90 : 0;
  const result = [];
  for (const angle of [preferAngle, other]) {
    const Wv = angle===0 ? W : H;
    const Hv = angle===0 ? H : W;
    // Centered at anchor
    result.push([ax, ay, angle]);
    // Slight offsets (up to ±30% of label size)
    result.push([ax, ay - Hv*0.3, angle]);
    result.push([ax, ay + Hv*0.3, angle]);
    result.push([ax - Wv*0.2, ay, angle]);
    result.push([ax + Wv*0.2, ay, angle]);
  }
  return result;
}

function buildEntryCands(ax, ay, W, H, G2) {
  const cands = [];
  // Priority: right, above, left, below, diagonals — all at 0°
  const positions = [
    [ax + W/2 + G2, ay         ],
    [ax - W/2 - G2, ay         ],
    [ax,            ay - H/2-G2],
    [ax,            ay + H/2+G2],
    [ax + W/2 + G2, ay - H/2-G2],
    [ax - W/2 - G2, ay - H/2-G2],
    [ax + W/2 + G2, ay + H/2+G2],
    [ax - W/2 - G2, ay + H/2+G2],
  ];
  for (const [cx, cy] of positions) cands.push([cx, cy, 0]);
  // 90° fallback positions
  cands.push([ax + H/2+G2, ay, 90]);
  cands.push([ax - H/2-G2, ay, 90]);
  cands.push([ax, ay - W/2-G2, 90]);
  cands.push([ax, ay + W/2+G2, 90]);
  return cands;
}

/* ════════════════════════════════════════════════════════════════
   TITLE CARD — positioned in world space from title_area
════════════════════════════════════════════════════════════════ */
function setupTitleCard(data) {
  const ta  = data._meta?.title_area;
  const ttl = data.title;
  const tc  = G('title-card');

  // Update text content from JSON title key
  if (ttl) {
    if (ttl.zh) G('tc-zh').textContent = ttl.zh;
    if (ttl.en_sub) G('tc-by-en').textContent = ttl.en_sub.replace('by ', '');
    if (ttl.zh_sub) G('tc-by-zh').textContent = ttl.zh_sub;
    // Rebuild en title with line breaks
    if (ttl.en) {
      const parts = ttl.en.match(/A Map of the|Lands of|Human Sexuality/g);
      G('tc-en').innerHTML = parts ? parts.join('<br>') : ttl.en;
    }
  }

  if (ta?.tl && ta?.tr && ta?.bl) {
    // World-space positioning (scales naturally with the map)
    const tl = {x: ta.tl.x/100*SVG_W, y: ta.tl.y/100*SVG_H};
    const tr = {x: ta.tr.x/100*SVG_W, y: ta.tr.y/100*SVG_H};
    const bl = {x: ta.bl.x/100*SVG_W, y: ta.bl.y/100*SVG_H};

    const W     = Math.hypot(tr.x-tl.x, tr.y-tl.y);
    const H     = Math.hypot(bl.x-tl.x, bl.y-tl.y);
    const angle = Math.atan2(tr.y-tl.y, tr.x-tl.x) * 180 / Math.PI;

    tc.style.left            = tl.x + 'px';
    tc.style.top             = tl.y + 'px';
    tc.style.width           = W    + 'px';
    tc.style.height          = H    + 'px';
    tc.style.transform       = `rotate(${angle}deg)`;
    tc.style.transformOrigin = '0 0';
    tc.style.display         = 'flex';

    // World-space font sizes: proportional to box width
    // At fit zoom (~0.56), these appear as: base*0.56 screen px
    const base  = W / 11.5; // ≈ 33px world → ~18px screen at fit zoom
    const inner = tc.querySelector('.tc-inner');
    G('tc-en').style.fontSize  = (base * 0.82) + 'px';
    G('tc-zh').style.fontSize  = (base * 0.95) + 'px';
    G('tc-zh').style.marginTop = (base * 0.18) + 'px';
    const byEl = tc.querySelector('.tc-by');
    if (byEl) byEl.style.fontSize = (base * 0.5) + 'px';
    inner.style.padding = `${H*0.1}px ${W*0.08}px`;

  } else {
    // Fallback: fixed screen position (no title_area annotated yet)
    tc.style.position    = 'fixed';
    tc.style.top         = '16px';
    tc.style.left        = '16px';
    tc.style.width       = '185px';
    tc.style.height      = 'auto';
    tc.style.padding     = '14px';
    tc.style.display     = 'flex';
    document.getElementById('ui').appendChild(tc);
    tc.style.pointerEvents = 'auto';
    G('tc-en').style.fontSize = '12.5px';
    G('tc-zh').style.fontSize = '13px';
    G('tc-zh').style.marginTop = '6px';
    const byEl = tc.querySelector('.tc-by');
    if (byEl) byEl.style.fontSize = '10px';
  }
}

/* ════════════════════════════════════════════════════════════════
   ZOOM / PAN — RAF throttled, zero label DOM writes per frame
════════════════════════════════════════════════════════════════ */
function scheduleRender() {
  if (!rafPending) { rafPending = true; requestAnimationFrame(applyT); }
}

function applyT() {
  rafPending = false;
  // ONE DOM write: the world transform
  G('world').style.transform = `translate(${panX.toFixed(1)}px,${panY.toFixed(1)}px) scale(${zoom})`;
  G('zoom-pct').textContent  = Math.round(zoom * 100) + '%';
  checkLOD();
}

function checkLOD() {
  const newLOD = zoom < Z_RGN ? 'none' : zoom < Z_ENT ? 'rgn' : 'all';
  if (newLOD !== currentLOD) {
    currentLOD = newLOD;
    // ONE class change on the container — browser handles all children
    G('labels').className = 'lod-' + newLOD;
  }
  // Geo labels: visibility toggle (only changes when threshold crossed)
  const showGeo = zoom >= Z_GEO;
  document.querySelectorAll('.geo-lod').forEach(el => {
    el.style.visibility = showGeo ? '' : 'hidden';
  });
}

function fitView() {
  const vw = window.innerWidth, vh = window.innerHeight;
  zoom = Math.min(vw / SVG_W, vh / SVG_H) * 0.97;
  panX = (vw - SVG_W * zoom) / 2;
  panY = (vh - SVG_H * zoom) / 2;
  scheduleRender();
}

function doZoom(f, cx, cy) {
  cx = cx ?? window.innerWidth  / 2;
  cy = cy ?? window.innerHeight / 2;
  const nz = Math.min(Math.max(zoom * f, Z_MIN), Z_MAX);
  panX = cx - (cx - panX) * (nz / zoom);
  panY = cy - (cy - panY) * (nz / zoom);
  zoom = nz;
  scheduleRender();
}

function setupPanZoom() {
  const vp = G('vp');

  vp.addEventListener('wheel', e => {
    e.preventDefault();
    doZoom(e.deltaY < 0 ? 1.12 : 0.9, e.clientX, e.clientY);
  }, {passive: false});

  vp.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    dragging = true; didMove = false;
    dragO = {x: e.clientX - panX, y: e.clientY - panY};
    vp.classList.add('drag');
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const nx = e.clientX - dragO.x, ny = e.clientY - dragO.y;
    if (Math.abs(nx-panX) > 3 || Math.abs(ny-panY) > 3) didMove = true;
    panX = nx; panY = ny;
    scheduleRender();
  });
  document.addEventListener('mouseup', () => {
    dragging = false;
    G('vp').classList.remove('drag');
    setTimeout(() => { didMove = false; }, 0);
  });

  // Click outside labels & popup → close popup
  vp.addEventListener('click', e => {
    if (!e.target.closest('.lbl') && !e.target.closest('#popup')) hidePopup();
  });

  // Touch: pan + pinch zoom
  let lt = 0, lts = [];
  vp.addEventListener('touchstart', e => {
    lts = Array.from(e.touches).map(t => ({x: t.clientX, y: t.clientY}));
    if (e.touches.length === 2)
      lt = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }, {passive: true});
  vp.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && lts.length >= 1) {
      panX += e.touches[0].clientX - lts[0].x;
      panY += e.touches[0].clientY - lts[0].y;
      scheduleRender();
    } else if (e.touches.length === 2) {
      const d  = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      doZoom(d / lt, mx, my);
      lt = d;
    }
    lts = Array.from(e.touches).map(t => ({x: t.clientX, y: t.clientY}));
  }, {passive: false});

  window.addEventListener('resize', fitView);
}

/* ════════════════════════════════════════════════════════════════
   STATE POPUP
════════════════════════════════════════════════════════════════ */
function showPopup(sx, sy, i) {
  if (selectedI === i && G('popup').style.display !== 'none') { hidePopup(); return; }
  selectedI = i;
  const item = items[i];
  G('pp-zh').textContent = item.zh;
  G('pp-en').textContent = item.en;
  G('popup').querySelectorAll('.pp-st').forEach(btn =>
    btn.classList.toggle('active', +btn.dataset.s === states[i]));
  // Clamp popup to viewport
  const PW = 228, PH = 120;
  const px = Math.min(Math.max(sx + 12, 8), window.innerWidth  - PW - 8);
  const py = Math.min(Math.max(sy - PH - 8, 8), window.innerHeight - PH - 72);
  const pop = G('popup');
  pop.style.left    = px + 'px';
  pop.style.top     = py + 'px';
  pop.style.display = 'block';
}
function hidePopup() {
  selectedI = -1;
  G('popup').style.display = 'none';
}
function setState(s) {
  if (selectedI < 0) return;
  states[selectedI] = s;
  lblEls[selectedI].dataset.s = String(s);
  G('popup').querySelectorAll('.pp-st').forEach(btn =>
    btn.classList.toggle('active', +btn.dataset.s === s));
}

/* ════════════════════════════════════════════════════════════════
   UI
════════════════════════════════════════════════════════════════ */
function setupUI() {
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA') return;
    if (e.key === '+' || e.key === '=') doZoom(1.25);
    if (e.key === '-')                   doZoom(0.8);
    if (e.key === '0')                   fitView();
    if (e.key === 'Escape') { hidePopup(); G('share-panel').style.display = 'none'; }
  });
}
function resetStates() {
  if (!confirm('重置所有选择？')) return;
  states.fill(0);
  lblEls.forEach(el => { el.dataset.s = '0'; });
  hidePopup();
  window.location.hash = '';
}
function toggleLegend() {
  G('legend').classList.toggle('collapsed');
  G('leg-toggle').textContent = G('legend').classList.contains('collapsed') ? '▼' : '▲';
}
async function openShare() {
  G('share-panel').style.display = 'block';
  G('share-url').value = '生成中…';
  G('share-url').value = await buildShareURL();
}
async function copyShare() {
  const url = G('share-url').value;
  try { await navigator.clipboard.writeText(url); }
  catch { G('share-url').select(); document.execCommand('copy'); }
  toast('✓ 链接已复制');
}
function toast(msg) {
  const t = G('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ════════════════════════════════════════════════════════════════
   SHARE URL ENCODING — 3 bits/item, deflate-raw, base64url
   Item ORDER is frozen; do not reorder items[].
════════════════════════════════════════════════════════════════ */
function packBits(sa) {
  const buf = new Uint8Array(Math.ceil(sa.length * 3 / 8));
  for (let i = 0; i < sa.length; i++) {
    const s = sa[i] & 7, bp = i*3, bi = bp>>3, bo = bp&7;
    buf[bi] |= s << bo;
    if (bo > 5 && bi+1 < buf.length) buf[bi+1] |= s >> (8-bo);
  }
  return buf;
}
function unpackBits(buf, n) {
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const bp = i*3, bi = bp>>3, bo = bp&7;
    let v = (buf[bi] >> bo) & 7;
    if (bo > 5 && bi+1 < buf.length) v |= (buf[bi+1] << (8-bo)) & 7;
    out[i] = Math.min(v, 4);
  }
  return out;
}
async function deflate(d) {
  try { const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(d);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer()); } catch { return d; }
}
async function inflate(d) {
  try { const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(d);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer()); } catch { return d; }
}
function b64u(buf) { let s=''; for(const b of buf)s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function db64u(s)  { const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
async function buildShareURL() {
  return `${location.origin}${location.pathname}#${VER}${b64u(await deflate(packBits(states)))}`;
}
async function restoreHash() {
  const h = location.hash.slice(1);
  if (!h.startsWith(VER)) return;
  try {
    const restored = unpackBits(await inflate(db64u(h.slice(VER.length))), items.length);
    for (let i = 0; i < restored.length && i < states.length; i++) states[i] = restored[i];
  } catch(e) { console.warn('Restore failed:', e); }
}

/* ════════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════════ */
async function init() {
  let data;
  try {
    const r = await fetch(DATA);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
  } catch(e) {
    G('loading').innerHTML =
      `<div style="color:#e53935;font-size:14px;text-align:center">
        无法加载数据<br><small style="color:#7a6840">${e.message}</small><br><br>
        <small style="color:#5a4820">请确认 ${DATA} 与 index.html 在同一目录</small>
      </div>`;
    return;
  }

  buildItems(data);
  states = new Uint8Array(items.length);
  await restoreHash(); // restore before building DOM

  // Wait for SVG background
  const bg = G('bg');
  bg.style.width  = SVG_W + 'px';
  bg.style.height = SVG_H + 'px';
  if (!bg.complete) await new Promise(r => { bg.onload = r; bg.onerror = r; });

  buildGeoSVG();
  placeAndBuildLabels();
  setupTitleCard(data);
  setupPanZoom();
  setupUI();
  fitView(); // sets initial zoom, triggers first LOD check

  G('loading').style.display = 'none';
}

function G(id) { return document.getElementById(id); }
init();
</script>
