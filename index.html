<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人类性癖地图</title>
<link rel="preload" href="1366.svg" as="image">
<style>
/* ═══════════════════════════════════════════════════════════
   RESET & TOKENS
═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --acc:#c8902a;--grn:#43A047;--red:#e53935;--ylw:#FDD835;--pur:#8E24AA;
  --bg:#0e0c08;--ui-bg:rgba(12,10,6,0.93);--bdr:rgba(200,144,42,0.35);
  /* Apple system font stack — matches iOS/macOS Maps aesthetic */
  --font:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',
          'Noto Sans SC','Microsoft YaHei',sans-serif;
}
body{background:var(--bg);overflow:hidden;width:100vw;height:100vh;
     font-family:var(--font)}

/* ═══════════════════════════════════════════════════════════
   MAP VIEWPORT & WORLD
═══════════════════════════════════════════════════════════ */
#vp{width:100vw;height:100vh;overflow:hidden;position:relative;cursor:grab;
    touch-action:none;background:var(--bg)}
#vp.drag{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;
       backface-visibility:hidden;-webkit-backface-visibility:hidden}
#bg{display:block;max-width:none;user-select:none;pointer-events:none}
#geo-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}

/* ═══════════════════════════════════════════════════════════
   LABEL LAYER
   ALL labels are COUNTER-SCALED via --inv CSS variable:
     #labels gets  style.setProperty('--inv', 1/zoom)  once per frame
     .lbl-rgn  transform-origin 50% 50%  (scales from centroid)
     .lbl-ent  transform-origin  0 0  (top anchor; translateX(-50%) centers)
   Result: labels always render at their CSS font-size in screen pixels.
   No blurring at any zoom. Zero per-label DOM writes per frame.
═══════════════════════════════════════════════════════════ */
#labels{position:absolute;top:0;left:0;pointer-events:none;overflow:hidden}

/* LOD: keep #labels in tree (avoid display:none flash); hide children only */
#labels.lod-none .lbl{visibility:hidden;pointer-events:none}
#labels.lod-rgn .lbl-ent{display:none!important}

.lbl{
  position:absolute;
  display:inline-flex;align-items:center;gap:4px;
  pointer-events:auto;cursor:pointer;
  white-space:nowrap;user-select:none;
  border-radius:3px;padding:1px 3px;
  background:transparent;
  transition:background .1s;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent; /* no blue flash on iOS tap */
}
.lbl:hover{background:rgba(255,255,255,.2)}
.lbl:active{background:rgba(255,255,255,.3)}
.lbl.lbl-skip{display:none!important}

/* Counter-scale transforms (backface-hidden reduces zoom compositor flashes) */
.lbl-rgn,.lbl-ent{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lbl-rgn{transform:scale(var(--inv,1));transform-origin:50% 50%}

/* Entry: dot at anchor (top-center), text below, wraps at ~6 Chinese chars */
.lbl-ent{
  transform:translateX(-50%) scale(var(--inv,1));
  transform-origin:0 0;           /* top-left after translateX centers it */
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:2px;
  padding:0 1px 2px;             /* no top padding: dot sits at anchor y */
}
.lbl-ent .ltxt{
  white-space:normal;
  word-break:break-all;           /* Chinese wraps freely */
  max-width:74px;                 /* ≈6 Chinese chars @ 12px; ~11 ASCII @ 10px */
  text-align:center;
  line-height:1.25;
}

/* ── State dot ── default GRAY (visible, not transparent) */
.dot{
  flex-shrink:0;border-radius:50%;
  border:1px solid rgba(0,0,0,0.12);
  transition:background .15s;
}
.lbl-rgn .dot{width:8px;height:8px}
.lbl-ent .dot{width:6px;height:6px}
/* state 0 = gray (default, always visible) */
.lbl[data-s="0"] .dot{background:rgba(130,130,130,0.45)}
.lbl[data-s="1"] .dot{background:var(--red);border-color:rgba(150,0,0,.3)}
.lbl[data-s="2"] .dot{background:var(--ylw);border-color:rgba(150,120,0,.3)}
.lbl[data-s="3"] .dot{background:var(--grn);border-color:rgba(0,100,0,.3)}
.lbl[data-s="4"] .dot{background:var(--pur);border-color:rgba(80,0,120,.3)}

/* ── Label text — Apple/Google Maps style ──
   Dark text + subtle gray drop shadow (not white border) */
.ltxt{
  font-family:var(--font);
  color:#1a1a1a;
  line-height:1;letter-spacing:.01em;
  /* Subtle white lift + gray drop shadow — Apple Maps aesthetic */
  text-shadow:0 0 3px rgba(255,255,255,.65),0 1px 2px rgba(0,0,0,.22);
}
.lbl-rgn .ltxt{font-weight:600;letter-spacing:.02em}
.lbl-ent .ltxt{font-weight:400}
.lbl-warn .ltxt{color:#3e0000}

/* ═══════════════════════════════════════════════════════════
   TITLE CARD — transparent text over SVG parchment, no rotation
═══════════════════════════════════════════════════════════ */
#title-card{
  position:absolute;
  background:transparent;border:none;box-shadow:none;
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;overflow:visible;
}
.tc-zh{
  font-family:var(--font);font-weight:700;color:#1e0e00;
  line-height:1.25;display:block;
}
.tc-rule{border:none;border-top:1px solid rgba(80,40,10,.28);width:72%;margin:.5em auto}
.tc-by{
  font-family:var(--font);color:#4a2a08;
  line-height:1.6;font-weight:400;
}
.tc-by a{color:#3a1e04;text-decoration:underline dotted}
.tc-by-en{font-size:.78em;opacity:.7}

/* ═══════════════════════════════════════════════════════════
   FIXED UI OVERLAY
═══════════════════════════════════════════════════════════ */
#ui{position:fixed;inset:0;pointer-events:none;z-index:200}

/* ── Popup ── */
/* ── Legend ── */
#legend{
  position:absolute;bottom:70px;left:16px;
  background:var(--ui-bg);border:1px solid var(--bdr);border-radius:9px;
  padding:11px 13px;pointer-events:auto;
}
#legend.collapsed .leg-body{display:none}
#legend.collapsed{opacity:.7}
.leg-handle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:14px}
.leg-title{font-size:11px;color:var(--acc);letter-spacing:.03em}
.leg-toggle{font-size:10px;color:rgba(200,144,42,.5)}
.leg-body{margin-top:8px}
.leg-row{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.leg-row:last-of-type{margin-bottom:0}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.12)}
.leg-dot.s0{background:rgba(130,130,130,.45)}.leg-dot.s1{background:var(--red)}
.leg-dot.s2{background:var(--ylw)}.leg-dot.s3{background:var(--grn)}.leg-dot.s4{background:var(--pur)}
.leg-txt{font-size:11px;color:rgba(200,160,90,.85)}
.leg-hint{margin-top:8px;padding-top:7px;border-top:1px solid rgba(200,144,42,.18);
          font-size:9px;color:rgba(200,160,90,.4);line-height:1.7}

/* ── Toolbar ── */
#toolbar{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  background:var(--ui-bg);border:1px solid var(--bdr);border-radius:40px;
  padding:6px 16px;pointer-events:auto;white-space:nowrap;
}
.tb-btn{background:none;border:none;color:rgba(200,160,90,.85);padding:5px 10px;
        border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--font);transition:.15s}
.tb-btn:hover{background:rgba(200,144,42,.18);color:#f0c860}
.tb-sep{width:1px;height:18px;background:rgba(200,144,42,.2)}
#zoom-pct{font-size:11px;color:rgba(200,160,90,.4);min-width:40px;text-align:center}

/* Language button — slightly highlighted */
#btn-lang{border:1px solid var(--bdr);border-radius:12px;font-size:11px;
          padding:3px 9px;color:rgba(200,160,90,.7)}
#btn-lang:hover{background:rgba(200,144,42,.2);color:var(--acc);border-color:var(--acc)}

/* ── Zoom controls ── */
#zoom-ctl{position:absolute;right:16px;top:50%;transform:translateY(-50%);
          display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.z-btn{width:32px;height:32px;background:var(--ui-bg);border:1px solid var(--bdr);
       color:rgba(200,160,90,.85);font-size:18px;cursor:pointer;border-radius:5px;
       display:flex;align-items:center;justify-content:center;transition:.15s}
.z-btn:hover{border-color:rgba(200,144,42,.7);color:var(--acc)}

/* ── Share panel ── */
#share-panel{
  position:absolute;bottom:68px;right:16px;width:300px;
  background:var(--ui-bg);border:1px solid var(--bdr);border-radius:10px;
  padding:14px;pointer-events:auto;backdrop-filter:blur(10px);
  display:none;box-shadow:0 8px 28px rgba(0,0,0,.65);
}
#share-panel h3{font-size:13px;color:var(--acc);margin-bottom:10px}
#share-url{width:100%;height:68px;background:rgba(255,255,255,.05);
           border:1px solid rgba(200,144,42,.25);color:rgba(200,160,90,.85);
           padding:8px;border-radius:4px;font-size:10px;font-family:monospace;
           resize:none;outline:none;word-break:break-all}
.sh-acts{display:flex;gap:8px;margin-top:9px}
.sh-btn{flex:1;padding:7px;border-radius:4px;font-size:11px;cursor:pointer;
        font-family:var(--font);transition:.15s}
.sh-btn.copy{background:rgba(200,144,42,.18);border:1px solid rgba(200,144,42,.45);color:var(--acc)}
.sh-btn.copy:hover{background:rgba(200,144,42,.32)}
.sh-btn.cls{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
            color:rgba(200,160,90,.55)}
.sh-btn.cls:hover{color:rgba(200,160,90,.85)}
.sh-note{font-size:9px;color:rgba(200,160,90,.35);margin-top:7px;line-height:1.6}

/* ── Toast & Attr ── */
#toast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);
       background:rgba(67,160,71,.92);color:#fff;padding:8px 22px;border-radius:20px;
       font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#attr{position:absolute;bottom:0;left:0;right:0;padding:3px 14px;text-align:center;
      font-size:10px;color:rgba(180,140,80,.32);pointer-events:auto}
#attr a{color:rgba(200,144,42,.44);text-decoration:none}
#attr a:hover{color:rgba(200,144,42,.9);text-decoration:underline}

/* ── Loading ── */
#loading{position:fixed;inset:0;z-index:999;background:var(--bg);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.ld-t{font-size:20px;color:var(--acc);text-align:center;line-height:1.4;
      text-shadow:0 0 20px rgba(200,144,42,.3);font-family:var(--font)}
.ld-s{font-size:11px;color:#7a6840}
.ld-b{width:180px;height:3px;background:rgba(200,144,42,.15);border-radius:2px;overflow:hidden}
.ld-f{height:100%;background:linear-gradient(90deg,var(--acc),#f0c860);
      animation:lda 1.4s ease-in-out infinite alternate}
@keyframes lda{from{width:20%}to{width:90%}}
</style>

<body>

                           data-en="All selections encoded in the URL. No server involved.">

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════ */
const DATA  = 'data.json';
const SVG_W = 2008, SVG_H = 1920;
const VER   = 'v1.';

// Zoom limits and initial level
const Z_MIN  = 0.5;   // cannot zoom out past this — no full-map view
const Z_MAX  = 4.5;   // reasonable max; labels are crisp at any zoom (counter-scaled)
const Z_INIT = 0.9;   // starting zoom (title area fills upper-left of screen)

// LOD thresholds
const Z_RGN  = 0.7;   // region labels appear above this (effective threshold may be lower — see lodZRgn)
const Z_ENT  = 1.3;   // entry labels appear above this
const Z_GEO  = 2.0;   // geo arc labels appear above this

// Never hide regions when map is already at minZoom (wide screens: minZoom can be < Z_RGN)
function lodZRgn(){return Math.min(Z_RGN,minZoom()*0.98);}

// Label screen font sizes (counter-scaled → always this size on screen)
const RGN_FONT_SCALE = 1.0;  // JSON fontSize (10–18) × this = screen px
const ENT_FONT       = 12;   // entry screen px

// Collision grid (world-px per cell, regions only)
const CELL = 14;
const GW   = Math.ceil(SVG_W / CELL);
const GH   = Math.ceil(SVG_H / CELL);

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
let items    = [];
let states   = null;
let lblEls   = [];      // parallel to items[] — null when entry DOM not mounted
let labelPlaced = null; // Map item → {cx,cy,W,H,sf} from buildLabels
let entriesMounted = false;
let geoElems = [];      // [{zh, en, tpHalo, tpFill}] for language switching
let lang     = 'zh';
let lastData  = null;
let lastZoom  = -1; // for skipping redundant applyT work during pan

let zoom = 1, panX = 0, panY = 0;
let dragging = false, didMove = false, dragO = {x:0,y:0};
let rafPending = false;
let curLOD = '', curGeoVis = null, cachedGeoEls = null;
let entryUnmountTimer = null;

/* ═══════════════════════════════════════════════════════════
   COORDINATE BUG FIX (v5 export double-applied percentage)
═══════════════════════════════════════════════════════════ */
function fixEntryCoords(allRgns) {
  const FX1=SVG_W/100, FY1=SVG_H/100;
  const FX2=FX1*FX1, FY2=FY1*FY1;
  for(const r of allRgns) for(const e of r.entries||[]) {
    if(e.x==null) continue;
    // v5 fractional export: 0.133 → ~53% (near region), NOT ×100 → 13%
    if(e.x>0&&e.x<1&&e.y>0&&e.y<1){e.x*=FX2;e.y*=FY2;continue;}
    // Already 1–100 % (incl. 1.68%)
    if(e.x>=1&&e.x<=100&&e.y>=1&&e.y<=100) continue;
    if(e.x*FX2>100||e.y*FY2>100){e.x*=FX1;e.y*=FY1;}
    else{e.x*=FX2;e.y*=FY2;}
  }
}

/* ═══════════════════════════════════════════════════════════
   BUILD ITEMS  ← ORDER FROZEN FOR SHARE LINKS
═══════════════════════════════════════════════════════════ */
function buildItems(d) {
  items=[]; geoElems=[];
  const allRgns=[...(d.regions||[]),...(d.islands||[]),...(d.warning_regions||[])];
  fixEntryCoords(allRgns);

  for(const g of d.geographical_features||[]) {
    if(g.x1==null) continue;
    geoElems.push({zh:g.zh,en:g.en,
      pts:[{x:g.x1/100*SVG_W,y:g.y1/100*SVG_H},
           {x:g.x2/100*SVG_W,y:g.y2/100*SVG_H},
           {x:g.x3/100*SVG_W,y:g.y3/100*SVG_H}]});
  }

  for(const r of allRgns) {
    if(r.x==null) continue;
    const cx=(r.center?.x??r.x)/100*SVG_W;
    const cy=(r.center?.y??r.y)/100*SVG_H;
    items.push({zh:r.zh,en:r.en,role:'region',
                ax:cx,ay:cy,
                screenFont:(r.fontSize||13)*RGN_FONT_SCALE,
                warn:!!(r.warning)});
    for(const e of r.entries||[]) {
      if(e.x==null) continue;
      items.push({zh:e.zh,en:e.en,role:'entry',
                  ax:e.x/100*SVG_W,ay:e.y/100*SVG_H,
                  screenFont:ENT_FONT,warn:!!(r.warning)});
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   GEO LABELS (curved SVG textPath)
═══════════════════════════════════════════════════════════ */
function buildGeoSVG() {
  const svg=G('geo-svg');
  svg.setAttribute('width',SVG_W);svg.setAttribute('height',SVG_H);
  const NS='http://www.w3.org/2000/svg';
  const defs=document.createElementNS(NS,'defs');svg.appendChild(defs);
  const GF=14;    // Chinese curved text font (world-px)
  const GF_EN=9;  // English straight text font (world-px, doesn't need to fit path)
  const FONT='-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans SC,sans-serif';

  geoElems.forEach((g,i)=>{
    const[p0,p1,p2]=g.pts;
    const cpx=2*p1.x-.5*(p0.x+p2.x),cpy=2*p1.y-.5*(p0.y+p2.y);
    const D=`M ${p0.x.toFixed(1)} ${p0.y.toFixed(1)} Q ${cpx.toFixed(1)} ${cpy.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    const ph=document.createElementNS(NS,'path');ph.id=`gp${i}`;ph.setAttribute('d',D);ph.setAttribute('fill','none');
    defs.appendChild(ph);

    // ── Curved text for Chinese (class: geo-zh) ──────────────────────
    const mkCurved=(isHalo)=>{
      const t=document.createElementNS(NS,'text');
      t.setAttribute('font-size',GF);t.setAttribute('font-family',FONT);
      t.setAttribute('font-weight','600');t.setAttribute('letter-spacing','0.5');
      t.className.baseVal='geo-lod geo-zh'; // geo-zh: visible in Chinese mode only
      if(isHalo){t.setAttribute('fill','none');t.setAttribute('stroke','rgba(255,255,255,.7)');
                 t.setAttribute('stroke-width','3');t.setAttribute('stroke-linejoin','round');}
      else{t.setAttribute('fill','#1a1a1a');t.setAttribute('opacity','.8');}
      const tp=document.createElementNS(NS,'textPath');
      tp.setAttribute('href',`#gp${i}`);tp.setAttribute('startOffset','50%');tp.setAttribute('text-anchor','middle');
      tp.textContent=g.zh;
      t.appendChild(tp);
      if(isHalo) g.tpHalo=tp; else g.tpFill=tp;
      return t;
    };
    svg.appendChild(mkCurved(true));
    svg.appendChild(mkCurved(false));

    // ── Straight horizontal text for English (class: geo-en) ─────────
    // p1 is the annotated midpoint of the arc — perfect center for a label.
    // No path length constraint: text can be any length.
    const mx=p1.x, my=p1.y;

    // Word-wrap: split English text at spaces, max ~14 chars per line
    function wrapEn(text, maxCh) {
      if (text.length <= maxCh) return [text];
      const words = text.split(' ');
      const lines = []; let cur = '';
      for (const w of words) {
        if (!cur) { cur = w; }
        else if ((cur + ' ' + w).length <= maxCh) { cur += ' ' + w; }
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      return lines;
    }
    const enLines = wrapEn(g.en, 14);
    const lineH   = GF_EN * 1.35;                          // world-px line height
    const yStart  = my - (enLines.length - 1) * lineH / 2; // center block at my

    const mkStraight=(isHalo)=>{
      const t=document.createElementNS(NS,'text');
      // No x/y on parent — tspans handle per-line positioning
      t.setAttribute('font-size',GF_EN);t.setAttribute('font-family',FONT);
      t.setAttribute('font-weight','600');t.setAttribute('letter-spacing','0.3');
      t.setAttribute('text-anchor','middle'); // each tspan inherits this
      t.className.baseVal='geo-lod geo-en';
      t.style.visibility='hidden';
      if(isHalo){t.setAttribute('fill','none');t.setAttribute('stroke','rgba(255,255,255,.7)');
                 t.setAttribute('stroke-width','3');t.setAttribute('stroke-linejoin','round');}
      else{t.setAttribute('fill','#1a1a1a');t.setAttribute('opacity','.8');}
      // Build one <tspan> per line; first sets absolute y, rest use dy
      enLines.forEach((line, li) => {
        const ts = document.createElementNS(NS,'tspan');
        ts.setAttribute('x', mx.toFixed(1));
        if (li === 0) { ts.setAttribute('y', yStart.toFixed(1)); }
        else          { ts.setAttribute('dy', lineH.toFixed(1)); }
        ts.textContent = line;
        t.appendChild(ts);
      });
      if(isHalo) g.enHalo=t; else g.enFill=t;
      return t;
    };
    svg.appendChild(mkStraight(true));
    svg.appendChild(mkStraight(false));
  });
}

/* ═══════════════════════════════════════════════════════════
   LABEL PLACEMENT

   REGIONS: collision-aware, ALL horizontal, counter-scaled.
            Built at init (~87 DOM nodes).

   ENTRIES: anchor placement, no collision. DOM mounted only when
            zoom ≥ Z_ENT; unmounted below to keep pan smooth.
═══════════════════════════════════════════════════════════ */
function langLabelScale(item){
  return lang==='en' ? (item.role==='entry' ? 0.83 : 0.80) : 1.0;
}

function mkLabelEl(i, item, p){
  const isRgn=item.role==='region';
  const el=document.createElement('div');
  el.className=['lbl',isRgn?'lbl-rgn':'lbl-ent',item.warn?'lbl-warn':''].filter(Boolean).join(' ');

  if(isRgn) {
    el.style.left=(p.cx-p.W/2)+'px';
    el.style.top =(p.cy-p.H/2)+'px';
  } else {
    el.style.left=item.ax+'px';
    el.style.top =item.ay+'px';
  }

  el.dataset.s=String(states[i]);
  el.title=item.en;

  const dot=document.createElement('div');dot.className='dot';
  const txt=document.createElement('span');txt.className='ltxt';
  txt.textContent=lang==='zh'?item.zh:item.en;
  txt.style.fontSize=(item.screenFont*langLabelScale(item))+'px';
  el.appendChild(dot);el.appendChild(txt);
  el.addEventListener('click',e=>{
    if(didMove) return;
    e.stopPropagation();
    const next=(states[i]+1)%5;
    states[i]=next;
    el.dataset.s=String(next);
  });
  return el;
}

function mountEntryLabels(){
  if(entriesMounted||!labelPlaced) return;
  const container=G('labels');
  const frag=document.createDocumentFragment();
  for(let i=0;i<items.length;i++){
    const item=items[i];
    if(item.role!=='entry') continue;
    const el=mkLabelEl(i,item,labelPlaced.get(item));
    frag.appendChild(el);
    lblEls[i]=el;
  }
  container.appendChild(frag);
  entriesMounted=true;
}

function unmountEntryLabels(){
  if(!entriesMounted) return;
  for(let i=0;i<items.length;i++){
    if(items[i].role!=='entry') continue;
    const el=lblEls[i];
    if(el) el.remove();
    lblEls[i]=null;
  }
  entriesMounted=false;
}

function syncEntryMount(){
  if(zoom>=Z_ENT){
    if(entryUnmountTimer){clearTimeout(entryUnmountTimer);entryUnmountTimer=null;}
    mountEntryLabels();
    return;
  }
  if(entryUnmountTimer) clearTimeout(entryUnmountTimer);
  entryUnmountTimer=setTimeout(()=>{
    entryUnmountTimer=null;
    if(zoom<Z_ENT) unmountEntryLabels();
  },120);
}

function buildLabels() {
  const grid=new Uint8Array(GW*GH);
  const PAD=3;

  function markGrid(cx,cy,W,H){
    const x1=Math.max(0,Math.floor((cx-W/2-PAD)/CELL));
    const y1=Math.max(0,Math.floor((cy-H/2-PAD)/CELL));
    const x2=Math.min(GW-1,Math.ceil((cx+W/2+PAD)/CELL));
    const y2=Math.min(GH-1,Math.ceil((cy+H/2+PAD)/CELL));
    for(let r=y1;r<=y2;r++) for(let c=x1;c<=x2;c++) grid[r*GW+c]=1;
  }
  function hitGrid(cx,cy,W,H){
    const x1=Math.max(0,Math.floor((cx-W/2-PAD)/CELL));
    const y1=Math.max(0,Math.floor((cy-H/2-PAD)/CELL));
    const x2=Math.min(GW-1,Math.ceil((cx+W/2+PAD)/CELL));
    const y2=Math.min(GH-1,Math.ceil((cy+H/2+PAD)/CELL));
    for(let r=y1;r<=y2;r++) for(let c=x1;c<=x2;c++) if(grid[r*GW+c]) return true;
    return false;
  }
  function inMap(cx,cy,W,H){
    return cx-W/2>=0&&cx+W/2<=SVG_W&&cy-H/2>=0&&cy+H/2<=SVG_H;
  }
  function estW(text,sf){
    const zh=(text.match(/[\u4e00-\u9fff\u3000-\u303f]/g)||[]).length;
    return zh*sf*1.0+(text.length-zh)*sf*0.55+10;
  }

  const container=G('labels');
  container.style.width=SVG_W+'px';container.style.height=SVG_H+'px';
  const placed=new Map();

  // ── Regions (collision-aware, horizontal only) ──
  for(const item of items.filter(i=>i.role==='region')) {
    const sf=item.screenFont;
    const W=estW(item.zh,sf), H=sf*1.4;
    const ax=item.ax, ay=item.ay;
    // World footprint at Z_RGN (when labels first appear)
    const wW=W/Z_RGN, wH=H/Z_RGN;
    const G2=4; // offset step

    const cands=[
      [ax,ay],[ax,ay-wH*.3],[ax,ay+wH*.3],
      [ax-wW*.2,ay],[ax+wW*.2,ay],
      [ax,ay-wH*.5],[ax,ay+wH*.5],
    ];
    let cx=ax,cy=ay,ok=false;
    for(const[cx2,cy2] of cands) {
      if(!inMap(cx2,cy2,wW,wH)) continue;
      if(!hitGrid(cx2,cy2,wW,wH)){cx=cx2;cy=cy2;ok=true;break;}
    }
    placed.set(item,{cx,cy,W,H,sf});
    markGrid(cx,cy,wW,wH);
  }

  // ── Entries (anchor placement, no collision) ──
  for(const item of items.filter(i=>i.role==='entry')) {
    placed.set(item,{cx:item.ax,cy:item.ay,W:0,H:0,sf:item.screenFont});
  }

  labelPlaced=placed;
  entriesMounted=false;
  lblEls=new Array(items.length);
  for(let i=0;i<items.length;i++){
    const item=items[i];
    if(item.role!=='region') continue;
    const el=mkLabelEl(i,item,placed.get(item));
    container.appendChild(el);
    lblEls[i]=el;
  }
}

/* ═══════════════════════════════════════════════════════════
   TITLE CARD — transparent, horizontal, Chinese only
═══════════════════════════════════════════════════════════ */
function setupTitleCard(d) {
  const ta=d?._meta?.title_area, tc=G('title-card');
  if(!ta?.tl||!ta?.tr||!ta?.bl){tc.style.display='none';return;}

  // Convert all 4 corners to world px
  const corners=[ta.tl,ta.tr,ta.br,ta.bl].map(c=>({x:c.x/100*SVG_W,y:c.y/100*SVG_H}));
  const xs=corners.map(c=>c.x), ys=corners.map(c=>c.y);
  const xMin=Math.min(...xs),xMax=Math.max(...xs);
  const yMin=Math.min(...ys),yMax=Math.max(...ys);
  const W=xMax-xMin, H=yMax-yMin;

  // Horizontal rectangle (no rotation) covering the bounding box of title_area
  tc.style.left=xMin+'px'; tc.style.top=yMin+'px';
  tc.style.width=W+'px';   tc.style.height=H+'px';
  tc.style.transform='none';
  tc.style.display='flex';

  // Font sizes proportional to card dimensions
  const base=W/11; // ≈34.7px world
  G('tc-zh').style.fontSize=(base*0.92)+'px';
  G('tc-zh').style.marginBottom=(base*0.12)+'px';
  const byEl=tc.querySelector('.tc-by');
  if(byEl)byEl.style.fontSize=(base*0.45)+'px';
}

/* ═══════════════════════════════════════════════════════════
   LANGUAGE TOGGLE
═══════════════════════════════════════════════════════════ */
function toggleLang() {
  lang=lang==='zh'?'en':'zh';
  G('btn-lang').textContent=lang==='zh'?'EN':'中文';

  // Map labels — update text AND font size
  // English labels tend to be wider/longer, so scale font down slightly
  lblEls.forEach((el,i)=>{
    if(!el) return;
    const item=items[i], txt=el.querySelector('.ltxt');
    txt.textContent = lang==='zh' ? item.zh : item.en;
    txt.style.fontSize = (item.screenFont * langLabelScale(item)) + 'px';
  });
  // Geo labels: swap curved Chinese ↔ straight horizontal English
  setGeoVis(zoom >= Z_GEO);
  // Popup button labels
  document.querySelectorAll('.pp-lbl,.leg-txt,.leg-title').forEach(el=>{
    const t=el.dataset[lang]; if(t) el.textContent=t;
  });
  document.querySelectorAll('[data-zh]').forEach(el=>{
    if(el.matches('.pp-lbl,.leg-txt,.leg-title')) return; // already handled
    if(el.matches('.dot,.leg-dot,.pp-dot')) return;       // dots, not text
    const t=el.dataset[lang]; if(t) el.textContent=t;
  });
}

/* ═══════════════════════════════════════════════════════════
   ZOOM / PAN — RAF throttled
   applyT: world transform + --inv every frame (pan/zoom stay in sync).
   checkLOD / entry mount only when zoom changes.
═══════════════════════════════════════════════════════════ */
function scheduleRender(){if(!rafPending){rafPending=true;requestAnimationFrame(applyT);}}

function syncLabelScale(){
  G('labels').style.setProperty('--inv',(1/zoom).toFixed(6));
  G('zoom-pct').textContent=Math.round(zoom*100)+'%';
}

function applyT(){
  rafPending=false;
  G('world').style.transform=`translate3d(${panX}px,${panY}px,0) scale(${zoom})`;
  syncLabelScale();
  if(zoom!==lastZoom){
    lastZoom=zoom;
    checkLOD();
  }
}

function checkLOD(){
  const lod=zoom<lodZRgn()?'none':zoom<Z_ENT?'rgn':'all';
  if(lod!==curLOD){curLOD=lod;G('labels').className='lod-'+lod;}
  syncEntryMount();
  const showGeo=zoom>=Z_GEO;
  if(showGeo!==curGeoVis) setGeoVis(showGeo);
}

// Show the correct geo label set (zh curved or en straight) based on current language
function setGeoVis(show) {
  curGeoVis=show;
  document.querySelectorAll('.geo-zh').forEach(el=>{
    el.style.visibility=(show && lang==='zh')?'':'hidden';
  });
  document.querySelectorAll('.geo-en').forEach(el=>{
    el.style.visibility=(show && lang==='en')?'':'hidden';
  });
}

/* ═══════════════════════════════════════════════════════════
   INITIAL VIEW — title area at upper-left
═══════════════════════════════════════════════════════════ */
/* ─── Pan constraint ───────────────────────────────────────────────────
   The map must always COVER the screen — no black background visible.
   minZoom is dynamic: max(Z_MIN, screen_w/SVG_W, screen_h/SVG_H).
   panX range: [screen_w − map_w, 0]   (map right edge ≥ screen right)
   panY range: [screen_h − map_h, 0]   (map bottom edge ≥ screen bottom)
──────────────────────────────────────────────────────────────────────── */
function minZoom(){
  return Math.max(Z_MIN, window.innerWidth/SVG_W, window.innerHeight/SVG_H);
}
function clampPan(){
  const vw=window.innerWidth, vh=window.innerHeight;
  panX=Math.min(Math.max(panX, vw - SVG_W*zoom), 0);
  panY=Math.min(Math.max(panY, vh - SVG_H*zoom), 0);
}

function initialView(){
  const ta=lastData?._meta?.title_area;
  const mz=minZoom();
  if(ta?.tl){
    zoom=Math.max(Z_INIT, mz);
    panX=40-ta.tl.x/100*SVG_W*zoom;
    panY=30-ta.tl.y/100*SVG_H*zoom;
  } else {
    zoom=mz;
    panX=(window.innerWidth -SVG_W*zoom)/2;
    panY=(window.innerHeight-SVG_H*zoom)/2;
  }
  clampPan();
  scheduleRender();
}
function resetView(){lastZoom=-1;initialView();}

function doZoom(f,cx,cy){
  cx=cx??window.innerWidth/2;cy=cy??window.innerHeight/2;
  const nz=Math.min(Math.max(zoom*f, minZoom()), Z_MAX);
  panX=cx-(cx-panX)*(nz/zoom);panY=cy-(cy-panY)*(nz/zoom);zoom=nz;
  clampPan();
  scheduleRender();
}

function setupPanZoom(){
  const vp=G('vp');
  vp.addEventListener('wheel',e=>{e.preventDefault();doZoom(e.deltaY<0?1.12:.9,e.clientX,e.clientY);},{passive:false});

  vp.addEventListener('mousedown',e=>{
    if(e.button!==0)return;dragging=true;didMove=false;
    dragO={x:e.clientX-panX,y:e.clientY-panY};vp.classList.add('drag');
    G('labels').style.pointerEvents='none'; // disable hit-testing during drag → faster
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const nx=e.clientX-dragO.x,ny=e.clientY-dragO.y;
    if(Math.abs(nx-panX)>3||Math.abs(ny-panY)>3)didMove=true;
    panX=nx;panY=ny;clampPan();scheduleRender();
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;G('vp').classList.remove('drag');
    G('labels').style.pointerEvents=''; // restore
    setTimeout(()=>{didMove=false;},0);
  });

  let lt=0,lts=[];
  vp.addEventListener('touchstart',e=>{
    lts=Array.from(e.touches).map(t=>({x:t.clientX,y:t.clientY}));
    if(e.touches.length===2)lt=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    G('labels').style.pointerEvents='none';
  },{passive:true});
  vp.addEventListener('touchend',()=>{
    G('labels').style.pointerEvents='';
  },{passive:true});
  vp.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&lts.length>=1){panX+=e.touches[0].clientX-lts[0].x;panY+=e.touches[0].clientY-lts[0].y;clampPan();scheduleRender();}
    else if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      doZoom(d/lt,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);lt=d;
    }
    lts=Array.from(e.touches).map(t=>({x:t.clientX,y:t.clientY}));
  },{passive:false});
}

function setupViewport(){
  let resizeT;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeT);
    resizeT=setTimeout(()=>{
      const mz=minZoom();
      if(zoom<mz){zoom=mz;lastZoom=-1;}
      clampPan();
      scheduleRender();
    },120);
  });
}

/* ═══════════════════════════════════════════════════════════
   STATE POPUP
═══════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════
   UI
═══════════════════════════════════════════════════════════ */
function setupUI(){
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='TEXTAREA')return;
    if(e.key==='+'||e.key==='=')doZoom(1.25);if(e.key==='-')doZoom(.8);
    if(e.key==='0')resetView();
    if(e.key==='Escape') G('share-panel').style.display='none';
  });
}
function resetStates(){
  if(!confirm(lang==='zh'?'重置所有选择？':'Reset all selections?'))return;
  states.fill(0);lblEls.forEach(el=>{if(el)el.dataset.s='0';});window.location.hash='';
}
function toggleLegend(){
  G('legend').classList.toggle('collapsed');
  G('leg-toggle').textContent=G('legend').classList.contains('collapsed')?'▼':'▲';
}
async function openShare(){
  G('share-panel').style.display='block';G('share-url').value='…';
  G('share-url').value=await buildShareURL();
}
async function copyShare(){
  const url=G('share-url').value;
  try{await navigator.clipboard.writeText(url);}catch{G('share-url').select();document.execCommand('copy');}
  showToast(lang==='zh'?'✓ 链接已复制':'✓ Copied');
}
function showToast(msg){const t=G('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ═══════════════════════════════════════════════════════════
   SHARE ENCODING — 3 bits/item, deflate-raw, base64url
═══════════════════════════════════════════════════════════ */
function pack(sa){const b=new Uint8Array(Math.ceil(sa.length*3/8));for(let i=0;i<sa.length;i++){const s=sa[i]&7,p=i*3,bi=p>>3,bo=p&7;b[bi]|=s<<bo;if(bo>5&&bi+1<b.length)b[bi+1]|=s>>(8-bo);}return b;}
function unpack(b,n){const o=new Uint8Array(n);for(let i=0;i<n;i++){const p=i*3,bi=p>>3,bo=p&7;let v=(b[bi]>>bo)&7;if(bo>5&&bi+1<b.length)v|=(b[bi+1]<<(8-bo))&7;o[i]=Math.min(v,4);}return o;}
async function cmp(d){try{const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(d);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer());}catch{return d;}}
async function dcm(d){try{const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(d);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer());}catch{return d;}}
function b64u(b){let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function db64(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function buildShareURL(){return`${location.origin}${location.pathname}#${VER}${b64u(await cmp(pack(states)))}`;}
async function restoreHash(){
  const h=location.hash.slice(1);if(!h.startsWith(VER))return;
  try{const r=unpack(await dcm(db64(h.slice(VER.length))),items.length);for(let i=0;i<r.length&&i<states.length;i++)states[i]=r[i];}
  catch(e){console.warn('[Map] hash:',e);}
}

/* ═══════════════════════════════════════════════════════════
   LOAD & INIT
═══════════════════════════════════════════════════════════ */
function loadJSON(url){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open('GET',url,true);x.responseType='json';x.timeout=15000;
    x.onload=()=>(x.status===200||x.status===0)&&x.response?res(x.response):rej(new Error(`HTTP ${x.status}`));
    x.onerror=()=>rej(new Error('Network error'));x.ontimeout=()=>rej(new Error('Timeout'));x.send();
  });
}

function showError(msg,detail){
  G('loading').innerHTML=
    `<div style="color:#e53935;font-size:14px;text-align:center;padding:20px;max-width:420px">
      <div style="font-size:24px;margin-bottom:12px">⚠</div>
      <b>${msg}</b><br>
      <small style="color:#7a6840;display:block;margin-top:8px;line-height:1.6">${detail}</small>
      <small style="color:#5a4820;display:block;margin-top:14px;line-height:1.7">
        必须通过 HTTP 服务器访问：<br>
        <code>python3 -m http.server 8080</code><br>
        然后访问 <a href="http://localhost:8080" style="color:#c8902a">http://localhost:8080</a><br>
        确认 <code>data.json</code> 和 <code>1366.svg</code> 与 index.html 在同一目录
      </small>
    </div>`;
}

async function init(){
  try{
    const data=await loadJSON(DATA);lastData=data;
    buildItems(data);states=new Uint8Array(items.length);
    try{await restoreHash();}catch(e){console.warn(e);}

    const bg=G('bg');bg.style.width=SVG_W+'px';bg.style.height=SVG_H+'px';
    await new Promise(r=>{if(bg.complete&&bg.naturalWidth){r();return;}bg.onload=r;bg.onerror=r;setTimeout(r,10000);});

    try{buildGeoSVG();}  catch(e){console.error('[Map] geo:',e);}
    try{buildLabels();}  catch(e){console.error('[Map] labels:',e);}
    try{setupTitleCard(data);}catch(e){console.error('[Map] title:',e);}

    setupPanZoom();setupViewport();setupUI();initialView();
    G('loading').style.display='none';
    const rgn=items.filter(i=>i.role==='region').length;
    console.log(`[Map] OK — ${items.length} items, ${rgn} region labels (entries lazy)`);
  } catch(e){
    console.error(e);showError(`无法加载 "${DATA}"`,e.message);
  }
}

function G(id){return document.getElementById(id);}
init();
</script>
