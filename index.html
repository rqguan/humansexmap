<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人类性癖地图</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --acc:#c8902a;--grn:#43A047;--red:#e53935;--ylw:#FDD835;--pur:#8E24AA;
  --bg:#0e0c08;--ui-bg:rgba(12,10,6,0.93);--bdr:rgba(200,144,42,0.35);
  --font:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',
          'Noto Sans SC','Microsoft YaHei',sans-serif;
}
body{background:var(--bg);overflow:hidden;width:100vw;height:100vh;font-family:var(--font)}

/* ── Viewport & World ── */
#vp{width:100vw;height:100vh;overflow:hidden;position:relative}
#vp.leaflet-container{background:transparent;font-family:var(--font)}
#vp:focus{outline:none}
#world{position:absolute;top:0;left:0;transform-origin:0 0;contain:layout;pointer-events:none}
#world .lbl{pointer-events:auto}
#geo-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}

/* ── Labels ── */
#labels{position:absolute;top:0;left:0;pointer-events:none;contain:layout style}
#labels.lod-none .lbl    {visibility:hidden}
#labels.lod-rgn  .lbl-ent{visibility:hidden}

.lbl{
  position:absolute;display:inline-flex;align-items:center;gap:4px;
  pointer-events:auto;cursor:pointer;white-space:nowrap;user-select:none;
  border-radius:3px;padding:1px 3px;transition:background .1s;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  content-visibility:auto;contain-intrinsic-size:auto 60px auto 18px;
}
.lbl:hover{background:rgba(255,255,255,.2)}
.lbl:active{background:rgba(255,255,255,.3)}

.lbl-ent{
  transform:translateX(-50%);transform-origin:0 0;
  flex-direction:column;align-items:center;text-align:center;gap:2px;padding:0 1px 2px;
}
.lbl-ent .ltxt{white-space:normal;word-break:break-all;max-width:74px;text-align:center;line-height:1.25}

/* Dots (position:relative + ::after enlarges the tap target on touch) */
.dot{flex-shrink:0;border-radius:50%;border:1px solid rgba(0,0,0,.12);transition:background .15s;position:relative}
.dot::after{content:'';position:absolute;inset:-9px}
.lbl-rgn .dot{width:8px;height:8px}
.lbl-ent .dot{width:6px;height:6px}
.lbl[data-s="0"] .dot{background:rgba(130,130,130,.45)}
.lbl[data-s="1"] .dot{background:var(--red);border-color:rgba(150,0,0,.3)}
.lbl[data-s="2"] .dot{background:var(--ylw);border-color:rgba(150,120,0,.3)}
.lbl[data-s="3"] .dot{background:var(--grn);border-color:rgba(0,100,0,.3)}
.lbl[data-s="4"] .dot{background:var(--pur);border-color:rgba(80,0,120,.3)}

.ltxt{
  font-family:var(--font);color:#1a1a1a;line-height:1;letter-spacing:.01em;
  text-shadow:0 0 3px rgba(255,255,255,.65),0 1px 2px rgba(0,0,0,.22);
}
.lbl-rgn .ltxt{font-weight:600;letter-spacing:.02em}
.lbl-ent .ltxt{font-weight:400}
.lbl-warn .ltxt{color:#3e0000}

/* ── Title card ── */
#title-card{
  position:absolute;background:transparent;border:none;box-shadow:none;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;overflow:visible;
}
.tc-main{font-family:var(--font);font-weight:700;color:#1e0e00;line-height:1.25;display:block}
.tc-rule{border:none;border-top:1px solid rgba(80,40,10,.28);width:72%;margin:.5em auto}
.tc-sub{font-family:var(--font);color:#4a2a08;line-height:1.6;font-weight:400}
.tc-sub a{color:#3a1e04;text-decoration:underline dotted}
.tc-credit{font-size:.78em;opacity:.7}

/* ── UI overlay ── */
#ui{position:fixed;inset:0;pointer-events:none;z-index:1000}

#legend{
  position:absolute;bottom:70px;left:16px;
  background:var(--ui-bg);border:1px solid var(--bdr);border-radius:9px;
  padding:11px 13px;pointer-events:auto;
}
#legend.collapsed .leg-body{display:none}
#legend.collapsed{opacity:.7}
.leg-handle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:14px}
.leg-title{font-size:11px;color:var(--acc);letter-spacing:.03em}
.leg-toggle{font-size:10px;color:rgba(200,144,42,.5)}
.leg-body{margin-top:8px}
.leg-row{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.leg-row:last-of-type{margin-bottom:0}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.12)}
.leg-dot.s0{background:rgba(130,130,130,.45)}.leg-dot.s1{background:var(--red)}
.leg-dot.s2{background:var(--ylw)}.leg-dot.s3{background:var(--grn)}.leg-dot.s4{background:var(--pur)}
.leg-txt{font-size:11px;color:rgba(200,160,90,.85)}
.leg-hint{margin-top:8px;padding-top:7px;border-top:1px solid rgba(200,144,42,.18);
          font-size:9px;color:rgba(200,160,90,.4);line-height:1.7}

#toolbar{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  background:var(--ui-bg);border:1px solid var(--bdr);border-radius:40px;
  padding:6px 16px;pointer-events:auto;white-space:nowrap;
}
.tb-btn{background:none;border:none;color:rgba(200,160,90,.85);padding:5px 10px;
        border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--font);transition:.15s}
.tb-btn:hover{background:rgba(200,144,42,.18);color:#f0c860}
.tb-sep{width:1px;height:18px;background:rgba(200,144,42,.2)}
#zoom-pct{font-size:11px;color:rgba(200,160,90,.4);min-width:40px;text-align:center}
#btn-lang{border:1px solid var(--bdr);border-radius:12px;font-size:11px;
          padding:3px 9px;color:rgba(200,160,90,.7)}
#btn-lang:hover{background:rgba(200,144,42,.2);color:var(--acc);border-color:var(--acc)}
#btn-lang:disabled{opacity:.4;cursor:wait}

#zoom-ctl{position:absolute;right:16px;top:50%;transform:translateY(-50%);
          display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.z-btn{width:32px;height:32px;background:var(--ui-bg);border:1px solid var(--bdr);
       color:rgba(200,160,90,.85);font-size:18px;cursor:pointer;border-radius:5px;
       display:flex;align-items:center;justify-content:center;transition:.15s}
.z-btn:hover{border-color:rgba(200,144,42,.7);color:var(--acc)}

#share-panel{
  position:absolute;bottom:68px;right:16px;width:300px;
  background:var(--ui-bg);border:1px solid var(--bdr);border-radius:10px;
  padding:14px;pointer-events:auto;backdrop-filter:blur(10px);
  display:none;box-shadow:0 8px 28px rgba(0,0,0,.65);
}
#share-panel h3{font-size:13px;color:var(--acc);margin-bottom:10px}
#share-url{width:100%;height:68px;background:rgba(255,255,255,.05);
           border:1px solid rgba(200,144,42,.25);color:rgba(200,160,90,.85);
           padding:8px;border-radius:4px;font-size:10px;font-family:monospace;
           resize:none;outline:none;word-break:break-all}
.sh-acts{display:flex;gap:8px;margin-top:9px}
.sh-btn{flex:1;padding:7px;border-radius:4px;font-size:11px;cursor:pointer;font-family:var(--font);transition:.15s}
.sh-btn.copy{background:rgba(200,144,42,.18);border:1px solid rgba(200,144,42,.45);color:var(--acc)}
.sh-btn.copy:hover{background:rgba(200,144,42,.32)}
.sh-btn.cls{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:rgba(200,160,90,.55)}
.sh-btn.cls:hover{color:rgba(200,160,90,.85)}
.sh-note{font-size:9px;color:rgba(200,160,90,.35);margin-top:7px;line-height:1.6}

/* ── Annotation tooltip (desc from lang files) ── */
#tip{
  position:fixed;display:none;z-index:1500;max-width:280px;
  background:var(--ui-bg);border:1px solid var(--bdr);border-radius:8px;
  padding:9px 11px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5);
}
#tip .tip-name{font-size:12px;color:var(--acc);font-weight:600;margin-bottom:4px}
#tip .tip-desc{font-size:11px;color:rgba(200,160,90,.88);line-height:1.65}
#geo-svg .geo-tip{pointer-events:auto;cursor:pointer}

#toast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);
       background:rgba(67,160,71,.92);color:#fff;padding:8px 22px;border-radius:20px;
       font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#attr{position:absolute;bottom:0;left:0;right:0;padding:3px 14px;text-align:center;
      font-size:10px;color:rgba(180,140,80,.32);pointer-events:auto}
#attr a{color:rgba(200,144,42,.44);text-decoration:none}
#attr a:hover{color:rgba(200,144,42,.9);text-decoration:underline}

#loading{position:fixed;inset:0;z-index:2000;background:var(--bg);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.ld-t{font-size:20px;color:var(--acc);text-align:center;line-height:1.4;
      text-shadow:0 0 20px rgba(200,144,42,.3);font-family:var(--font)}
.ld-s{font-size:11px;color:#7a6840}
.ld-b{width:180px;height:3px;background:rgba(200,144,42,.15);border-radius:2px;overflow:hidden}
.ld-f{height:100%;background:linear-gradient(90deg,var(--acc),#f0c860);
      animation:lda 1.4s ease-in-out infinite alternate}
@keyframes lda{from{width:20%}to{width:90%}}
</style>
</head>

  <div class="ld-t">A Map of the Lands<br>of Human Sexuality</div>

<script src="leaflet/leaflet.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════ */
const DATA_URL  = 'data.json';
const TILE_URL  = 'tiles/{z}/{x}/{y}.webp';
const LANG_URL  = l => `lang/${l}.json`;
const SVG_W = 2008, SVG_H = 1920;
const VER   = 'v1.';

const Z_MIN  = 0.5, Z_MAX = 4.5, Z_INIT = 0.9;
const Z_RGN  = 0.7, Z_ENT = 1.3, Z_GEO  = 2.0;
const RGN_FONT_SCALE = 1.0, ENT_FONT = 12;
const GF_ZH = 14, GF_OTHER = 9;    // geo label font sizes (world-px)
const CELL = 14;
const GW = Math.ceil(SVG_W / CELL), GH = Math.ceil(SVG_H / CELL);

// UI text per language (for static UI strings — not map content)
const UI_TEXT = {
  zh: { lang_btn:'EN', reset:'↺ 重置', share:'🔗 分享', leg_title:'点击词条选择状态',
        s0:'未选择', s1:'讨厌', s2:'可以尝试', s3:'喜欢', s4:'非常喜欢',
        hint:'滚轮 / 双指 缩放 · 拖拽 平移\n放大查看子区词条 · 点击选择状态',
        sh_title:'🔗 分享我的地图', sh_copy:'📋 复制链接', sh_close:'关闭',
        sh_note:'链接编码了所有选择，不经过任何服务器。',
        reset_confirm:'重置所有选择？', toast_copied:'✓ 链接已复制' },
  en: { lang_btn:'中文', reset:'↺ Reset', share:'🔗 Share', leg_title:'Click to rate',
        s0:'None', s1:'Nope', s2:'Maybe', s3:'Like', s4:'Love',
        hint:'Scroll / pinch to zoom · drag to pan\nZoom in to see entries · click to rate',
        sh_title:'🔗 Share my map', sh_copy:'📋 Copy link', sh_close:'Close',
        sh_note:'All selections encoded in URL. No server involved.',
        reset_confirm:'Reset all selections?', toast_copied:'✓ Copied' },
};

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
let items    = [];          // [{id, role, ax, ay, screenFont, warn}, ...]
let states   = null;        // Uint8Array, parallel to items
let lblEls   = [];          // DOM elements, parallel to items
let geoElems = [];          // [{id, pts, midX, midY, tpHalo, tpFill, stHalo, stFill}, ...]
let lang     = 'zh';
let langData  = {};         // current: { id → {id, name, desc, url} }
let langCache = {};         // { 'zh' → langData, 'en' → langData, ... }
let lastData  = null;
let lastZoom  = -1;

let zoom = 1;               // app scale (CSS px per SVG unit) — kept in sync with Leaflet
let map = null, tileLayer = null;
let downXY = null;          // pointerdown position — tap-vs-drag guard
let curLOD = '', curGeoVis = null;
const TOUCH_MODE = (() => { try { return matchMedia('(hover: none)').matches; } catch { return false; } })();

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
const G = id => document.getElementById(id);

// Text from current lang file, fallback to id
const T  = id  => langData[id]?.name  ?? id;
// UI string from hard-coded UI_TEXT dict
const UI = key => (UI_TEXT[lang] ?? UI_TEXT.zh)[key] ?? key;

// Word-wrap for geo straight text
function wrapText(text, maxCh) {
  if (!text || text.length <= maxCh) return [text || ''];
  const words = text.split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    if (!cur) { cur = w; }
    else if ((cur + ' ' + w).length <= maxCh) { cur += ' ' + w; }
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

// Estimate rendered width of a string at a given font size
function estW(text, sf) {
  const zh = (text.match(/[\u4e00-\u9fff\u3000-\u303f]/g) || []).length;
  return zh * sf * 1.0 + (text.length - zh) * sf * 0.55 + 10;
}

/* ═══════════════════════════════════════════════════════════
   COORDINATE FIX (v5 annotator export bug)
═══════════════════════════════════════════════════════════ */
function fixEntryCoords(allRgns) {
  const FX2 = SVG_W * SVG_W / 10000, FY2 = SVG_H * SVG_H / 10000;
  const FX1 = SVG_W / 100,           FY1 = SVG_H / 100;
  for (const r of allRgns) for (const e of r.entries || []) {
    if (e.x == null) continue;
    if (e.x * FX2 > 100 || e.y * FY2 > 100) { e.x *= FX1; e.y *= FY1; }
    else { e.x *= FX2; e.y *= FY2; }
  }
}

/* ═══════════════════════════════════════════════════════════
   BUILD ITEMS — order frozen (share-link encoding depends on it)
   Items store only structural data (id, coords, role).
   All text comes from langData at render time.
═══════════════════════════════════════════════════════════ */
function buildItems(d) {
  items = []; geoElems = [];
  const allRgns = [...(d.regions||[]), ...(d.islands||[]), ...(d.warning_regions||[])];
  fixEntryCoords(allRgns);

  // Geo features
  for (const g of d.geographical_features || []) {
    if (g.x1 == null) continue;
    geoElems.push({
      id: g.id,
      pts: [
        {x: g.x1/100*SVG_W, y: g.y1/100*SVG_H},
        {x: g.x2/100*SVG_W, y: g.y2/100*SVG_H},
        {x: g.x3/100*SVG_W, y: g.y3/100*SVG_H},
      ]
    });
  }

  // Regions + entries
  for (const r of allRgns) {
    if (r.x == null) continue;
    const cx = (r.center?.x ?? r.x) / 100 * SVG_W;
    const cy = (r.center?.y ?? r.y) / 100 * SVG_H;
    items.push({ id: r.id, role: 'region',
                 ax: cx, ay: cy,
                 screenFont: (r.fontSize || 13) * RGN_FONT_SCALE,
                 warn: !!(r.warning) });
    for (const e of r.entries || []) {
      if (e.x == null) continue;
      items.push({ id: e.id, role: 'entry',
                   ax: e.x / 100 * SVG_W, ay: e.y / 100 * SVG_H,
                   screenFont: ENT_FONT, warn: !!(r.warning) });
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   GEO SVG — curved (zh) + straight fallback (all other langs)
═══════════════════════════════════════════════════════════ */
function bindGeoTip(elm, id) {
  elm.classList.add('geo-tip');
  if (TOUCH_MODE) {
    elm.addEventListener('click', e => { e.stopPropagation(); if (!movedSince(e)) showTip(elm, id); });
  } else {
    elm.addEventListener('mouseenter', () => showTip(elm, id));
    elm.addEventListener('mouseleave', hideTip);
  }
}

function buildGeoSVG() {
  const svg = G('geo-svg');
  svg.setAttribute('width', SVG_W); svg.setAttribute('height', SVG_H);
  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);   // lets CSS size rescale vectors crisply
  const NS   = 'http://www.w3.org/2000/svg';
  const FONT = '-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans SC,sans-serif';
  const defs = document.createElementNS(NS, 'defs');
  svg.appendChild(defs);

  geoElems.forEach((g, i) => {
    const [p0, p1, p2] = g.pts;
    const cpx = 2*p1.x - .5*(p0.x+p2.x), cpy = 2*p1.y - .5*(p0.y+p2.y);
    const D = `M${p0.x.toFixed(1)} ${p0.y.toFixed(1)} Q${cpx.toFixed(1)} ${cpy.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    const ph = document.createElementNS(NS, 'path');
    ph.id = `gp${i}`; ph.setAttribute('d', D); ph.setAttribute('fill', 'none');
    defs.appendChild(ph);

    // Store midpoint for rebuilding straight tspans on lang switch
    g.midX = p1.x; g.midY = p1.y;

    const baseAttrs = (t, fs) => {
      t.setAttribute('font-size', fs); t.setAttribute('font-family', FONT);
      t.setAttribute('font-weight', '600'); t.setAttribute('letter-spacing', '0.5');
    };
    const haloAttrs = t => {
      t.setAttribute('fill', 'none'); t.setAttribute('stroke', 'rgba(255,255,255,.7)');
      t.setAttribute('stroke-width', '3'); t.setAttribute('stroke-linejoin', 'round');
    };
    const fillAttrs = t => { t.setAttribute('fill', '#1a1a1a'); t.setAttribute('opacity', '.8'); };

    // ── Curved (Chinese) ──
    const mkCurved = isHalo => {
      const t = document.createElementNS(NS, 'text');
      baseAttrs(t, GF_ZH); t.className.baseVal = 'geo-lod geo-zh';
      isHalo ? haloAttrs(t) : fillAttrs(t);
      const tp = document.createElementNS(NS, 'textPath');
      tp.setAttribute('href', `#gp${i}`); tp.setAttribute('startOffset', '50%');
      tp.setAttribute('text-anchor', 'middle'); tp.textContent = T(g.id);
      t.appendChild(tp);
      if (isHalo) g.tpHalo = tp; else g.tpFill = tp;
      return t;
    };
    svg.appendChild(mkCurved(true));
    const curvedFill = mkCurved(false);
    svg.appendChild(curvedFill);
    bindGeoTip(curvedFill, g.id);

    // ── Straight (all other languages) ──
    const mkStraight = isHalo => {
      const t = document.createElementNS(NS, 'text');
      baseAttrs(t, GF_OTHER);
      t.setAttribute('text-anchor', 'middle');
      t.className.baseVal = 'geo-lod geo-other';
      t.style.visibility = 'hidden';
      isHalo ? haloAttrs(t) : fillAttrs(t);
      if (isHalo) g.stHalo = t; else g.stFill = t;
      return t;
    };
    svg.appendChild(mkStraight(true));
    svg.appendChild(mkStraight(false));
    bindGeoTip(g.stFill, g.id);

    // Fill straight tspans for initial language (may not be zh)
    rebuildGeoStraight(g);
  });
}

// Rebuild tspans for a geo element's straight text (non-zh mode)
function rebuildGeoStraight(g) {
  const NS = 'http://www.w3.org/2000/svg';
  const name  = T(g.id);
  const lines = wrapText(name, 14);
  const lineH = GF_OTHER * 1.35;
  const yStart = g.midY - (lines.length - 1) * lineH / 2;

  [g.stHalo, g.stFill].forEach(el => {
    if (!el) return;
    while (el.firstChild) el.removeChild(el.firstChild);
    lines.forEach((line, li) => {
      const ts = document.createElementNS(NS, 'tspan');
      ts.setAttribute('x', g.midX.toFixed(1));
      li === 0 ? ts.setAttribute('y', yStart.toFixed(1))
               : ts.setAttribute('dy', lineH.toFixed(1));
      ts.textContent = line;
      el.appendChild(ts);
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   LABEL PLACEMENT
═══════════════════════════════════════════════════════════ */
function buildLabels() {
  const grid = new Uint8Array(GW * GH);
  const PAD  = 3;

  const markGrid = (cx,cy,W,H) => {
    const x1=Math.max(0,Math.floor((cx-W/2-PAD)/CELL)), y1=Math.max(0,Math.floor((cy-H/2-PAD)/CELL));
    const x2=Math.min(GW-1,Math.ceil((cx+W/2+PAD)/CELL)), y2=Math.min(GH-1,Math.ceil((cy+H/2+PAD)/CELL));
    for(let r=y1;r<=y2;r++) for(let c=x1;c<=x2;c++) grid[r*GW+c]=1;
  };
  const hitGrid = (cx,cy,W,H) => {
    const x1=Math.max(0,Math.floor((cx-W/2-PAD)/CELL)), y1=Math.max(0,Math.floor((cy-H/2-PAD)/CELL));
    const x2=Math.min(GW-1,Math.ceil((cx+W/2+PAD)/CELL)), y2=Math.min(GH-1,Math.ceil((cy+H/2+PAD)/CELL));
    for(let r=y1;r<=y2;r++) for(let c=x1;c<=x2;c++) if(grid[r*GW+c]) return true;
    return false;
  };
  const inMap = (cx,cy,W,H) => cx-W/2>=0&&cx+W/2<=SVG_W&&cy-H/2>=0&&cy+H/2<=SVG_H;

  const container = G('labels');
  container.style.width = SVG_W+'px'; container.style.height = SVG_H+'px';
  const placed = new Map();

  // Regions — collision-aware, horizontal
  for (const item of items.filter(i => i.role === 'region')) {
    const sf = item.screenFont;
    const name = T(item.id);
    const W = estW(name, sf), H = sf * 1.4;
    const ax = item.ax, ay = item.ay;
    const wW = W/Z_RGN, wH = H/Z_RGN;
    const cands = [[ax,ay],[ax,ay-wH*.3],[ax,ay+wH*.3],
                   [ax-wW*.2,ay],[ax+wW*.2,ay],[ax,ay-wH*.5],[ax,ay+wH*.5]];
    let cx=ax, cy=ay;
    for (const [cx2,cy2] of cands) {
      if (!inMap(cx2,cy2,wW,wH)) continue;
      if (!hitGrid(cx2,cy2,wW,wH)) { cx=cx2; cy=cy2; break; }
    }
    placed.set(item, {cx, cy, W, H, sf});
    markGrid(cx, cy, wW, wH);
  }

  // Entries — at anchor, no collision
  for (const item of items.filter(i => i.role === 'entry'))
    placed.set(item, {cx: item.ax, cy: item.ay, W:0, H:0, sf: item.screenFont});

  // Build DOM
  lblEls = items.map((item, i) => {
    const p   = placed.get(item);
    const isR = item.role === 'region';
    const el  = document.createElement('div');
    el.className = ['lbl', isR?'lbl-rgn':'lbl-ent', item.warn?'lbl-warn':''].filter(Boolean).join(' ');

    el._id = item.id; el._ent = !isR;
    if (isR) { el._ax = p.cx; el._ay = p.cy; el._w = p.W; el._h = p.H; }
    else     { el._ax = item.ax; el._ay = item.ay; }
    posLabel(el, bakedZoom);

    el.dataset.s = String(states[i]);

    const dot = document.createElement('div'); dot.className = 'dot';
    const txt = document.createElement('span'); txt.className = 'ltxt';
    txt.textContent = T(item.id);
    txt.style.fontSize = p.sf + 'px';

    el.appendChild(dot); el.appendChild(txt);
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (movedSince(e)) return;                       // was a drag, not a tap
      if (TOUCH_MODE && e.target.closest('.ltxt')) {   // mobile: tap on text = annotation
        showTip(el, item.id);
        return;
      }
      hideTip();
      const next = (states[i] + 1) % 5;
      states[i] = next;
      el.dataset.s = String(next);
    });
    container.appendChild(el);
    return el;
  });

  // Desktop: hover shows the annotation from the language file
  if (!TOUCH_MODE) {
    container.addEventListener('mouseover', e => {
      const l = e.target.closest('.lbl'); if (l) showTip(l, l._id);
    });
    container.addEventListener('mouseout', e => {
      if (e.target.closest('.lbl')) hideTip();
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   ANNOTATION TOOLTIP (desc from lang/*.json)
═══════════════════════════════════════════════════════════ */
const movedSince = e => downXY && (Math.abs(e.clientX-downXY.x) + Math.abs(e.clientY-downXY.y) > 8);

function showTip(el, id) {
  const d = langData[id];
  if (!d || !d.desc) { hideTip(); return; }
  const tip = G('tip');
  G('tip-name').textContent = d.name || id;
  G('tip-desc').textContent = d.desc;
  tip.style.display = 'block';
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width/2 - tw/2;
  x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
  let y = r.top - th - 8;
  if (y < 8) y = Math.min(r.bottom + 8, window.innerHeight - th - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { const t = G('tip'); if (t) t.style.display = 'none'; }

/* ═══════════════════════════════════════════════════════════
   TITLE CARD
═══════════════════════════════════════════════════════════ */
let tcBase = null;
function setupTitleCard(d) {
  const ta = d?._meta?.title_area, tc = G('title-card');
  if (!ta?.tl || !ta?.tr || !ta?.bl) { tc.style.display='none'; return; }
  const corners = [ta.tl,ta.tr,ta.br,ta.bl].map(c=>({x:c.x/100*SVG_W, y:c.y/100*SVG_H}));
  const xs=corners.map(c=>c.x), ys=corners.map(c=>c.y);
  const xMin=Math.min(...xs), xMax=Math.max(...xs);
  const yMin=Math.min(...ys), yMax=Math.max(...ys);
  tcBase = { x:xMin, y:yMin, w:xMax-xMin, h:yMax-yMin };
  layoutTitleCard(bakedZoom);
  updateTitleCard();
}

// (Re)apply title card geometry at the current baked scale
function layoutTitleCard(s) {
  if (!tcBase) return;
  const tc = G('title-card');
  tc.style.cssText = `left:${tcBase.x*s}px;top:${tcBase.y*s}px;width:${tcBase.w*s}px;height:${tcBase.h*s}px;display:flex;transform:none`;
  const base = tcBase.w*s/11;
  G('tc-main').style.fontSize  = (base*0.92)+'px';
  G('tc-main').style.marginBottom = (base*0.12)+'px';
  tc.querySelector('.tc-sub').style.fontSize = (base*0.45)+'px';
}

function updateTitleCard() {
  const entry = langData['_title'];
  if (!entry) return;
  G('tc-main').textContent = entry.name || '';
  const cred = G('tc-credit');
  if (cred) cred.textContent = entry.sub ? `${entry.sub}` : '';
}

/* ═══════════════════════════════════════════════════════════
   LANGUAGE SWITCH — async, loads lang file on demand
═══════════════════════════════════════════════════════════ */
async function toggleLang() {
  const newLang = lang === 'zh' ? 'en' : 'zh';
  const btn = G('btn-lang');
  btn.disabled = true;

  // Load lang file if not cached
  if (!langCache[newLang]) {
    try { langCache[newLang] = await loadJSON(LANG_URL(newLang)); }
    catch (e) { console.error('[Map] lang load failed:', e); btn.disabled=false; return; }
  }

  lang     = newLang;
  langData = langCache[newLang];

  // Update map label texts + font sizes
  lblEls.forEach((el, i) => {
    const item = items[i];
    const txt  = el.querySelector('.ltxt');
    txt.textContent = T(item.id);
    const scale = lang !== 'zh' ? (item.role==='entry' ? 0.83 : 0.80) : 1.0;
    txt.style.fontSize = (item.screenFont * scale) + 'px';
  });

  // Update geo labels
  geoElems.forEach(g => {
    const name = T(g.id);
    if (g.tpHalo) g.tpHalo.textContent = name;
    if (g.tpFill) g.tpFill.textContent = name;
    rebuildGeoStraight(g);
  });
  setGeoVis(zoom >= Z_GEO);

  // Update title card
  updateTitleCard();

  // Update static UI strings
  applyUIStrings();

  btn.disabled = false;
}

// Apply all static UI strings for current language
function applyUIStrings() {
  const u = UI_TEXT[lang] ?? UI_TEXT.zh;
  G('btn-lang').textContent  = u.lang_btn;
  G('btn-reset').textContent = u.reset;
  G('btn-share').textContent = u.share;
  G('leg-title').textContent = u.leg_title;
  G('ls0').textContent = u.s0; G('ls1').textContent = u.s1;
  G('ls2').textContent = u.s2; G('ls3').textContent = u.s3;
  G('ls4').textContent = u.s4;
  G('leg-hint').textContent  = u.hint;
  G('sh-title').textContent  = u.sh_title;
  G('sh-copy').textContent   = u.sh_copy;
  G('sh-close').textContent  = u.sh_close;
  G('sh-note').textContent   = u.sh_note;
}

/* ═══════════════════════════════════════════════════════════
   GEO VISIBILITY (LOD + lang)
═══════════════════════════════════════════════════════════ */
function setGeoVis(show) {
  curGeoVis = show;
  document.querySelectorAll('.geo-zh').forEach(el =>
    el.style.visibility = (show && lang==='zh') ? '' : 'hidden');
  document.querySelectorAll('.geo-other').forEach(el =>
    el.style.visibility = (show && lang!=='zh') ? '' : 'hidden');
}

/* ═══════════════════════════════════════════════════════════
   ZOOM-DEPENDENT UI (labels inverse scale, LOD, zoom %)
═══════════════════════════════════════════════════════════ */
function syncZoomUI() {
  zoom = l2s(map.getZoom());
  if (zoom !== lastZoom) {
    lastZoom = zoom;
    G('zoom-pct').textContent = Math.round(zoom*100)+'%';
    checkLOD();
  }
}

function checkLOD() {
  // Region labels stay visible all the way down to the dynamic minimum zoom
  const zRgn = Math.min(Z_RGN, minZoom());
  const lod = zoom < zRgn - 1e-9 ? 'none' : zoom<Z_ENT ? 'rgn' : 'all';
  if (lod !== curLOD) { curLOD=lod; G('labels').className='lod-'+lod; }
  const showGeo = zoom >= Z_GEO;
  if (showGeo !== curGeoVis) setGeoVis(showGeo);
}

/* ═══════════════════════════════════════════════════════════
   LEAFLET MAP — CRS.Simple, latlng = SVG units ([-y, x])
   leaflet zoom l ⇄ app scale s:  s = 2^l
═══════════════════════════════════════════════════════════ */
const s2l = s => Math.log2(s);          // app scale  → leaflet zoom
const l2s = l => Math.pow(2, l);        // leaflet zoom → app scale
const MAP_BOUNDS = [[-SVG_H, 0], [0, SVG_W]];

function minZoom() { return Math.max(Z_MIN, window.innerWidth/SVG_W, window.innerHeight/SVG_H); }

/* Existing #world (geo-svg + labels + title card) synced to the map.
   "Bake" architecture: while a gesture is in progress the whole layer is
   CSS-scaled (cheap, single transform); once the zoom settles the scale is
   baked into element coordinates/sizes so that at rest NO ancestor scale
   exists — text renders at native resolution (crisp on mobile GPUs, which
   cap raster resolution of huge scaled layers). */
let bakedZoom = 1, worldLayer = null, bakeTimer = 0;

const WorldLayer = L.Layer.extend({
  onAdd(m) {
    this._el = G('world');
    L.DomUtil.addClass(this._el, 'leaflet-zoom-animated');
    m.getPane('overlayPane').appendChild(this._el);
    this._update();
  },
  onRemove() { this._el.remove(); },
  getEvents() {
    const ev = { zoom: this._update, viewreset: this._update, zoomend: this._update };
    if (this._map._zoomAnimated) ev.zoomanim = this._animateZoom;
    return ev;
  },
  _update() {
    const p = this._map.latLngToLayerPoint([0, 0]);
    L.DomUtil.setTransform(this._el, p, l2s(this._map.getZoom()) / bakedZoom);
  },
  _animateZoom(e) {
    const p = this._map._latLngToNewLayerPoint([0, 0], e.zoom, e.center);
    L.DomUtil.setTransform(this._el, p, l2s(e.zoom) / bakedZoom);
  },
});

function posLabel(el, s) {
  if (el._ent) { el.style.left = el._ax*s + 'px'; el.style.top = el._ay*s + 'px'; }
  else { el.style.left = (el._ax*s - el._w/2) + 'px'; el.style.top = (el._ay*s - el._h/2) + 'px'; }
}

function bake(s) {
  if (s === bakedZoom || !worldLayer) return;
  bakedZoom = s;
  for (const id of ['world', 'geo-svg', 'labels']) {
    const el = G(id);
    el.style.width = SVG_W*s + 'px'; el.style.height = SVG_H*s + 'px';
  }
  for (const el of lblEls) if (el) posLabel(el, s);
  layoutTitleCard(s);
  worldLayer._update();
}
function scheduleBake() {
  clearTimeout(bakeTimer);
  bakeTimer = setTimeout(() => bake(zoom), 140);
}

function setupMap() {
  map = L.map('vp', {
    crs: L.CRS.Simple,
    attributionControl: false, zoomControl: false,
    zoomSnap: 0, zoomDelta: 0.35, scrollWheelZoom: false,
    minZoom: s2l(minZoom()), maxZoom: s2l(Z_MAX),
    maxBounds: MAP_BOUNDS, maxBoundsViscosity: 1.0,
    bounceAtZoomLimits: false,
    doubleClickZoom: false, boxZoom: false, keyboard: false,
  });

  // Custom wheel zoom: immediate, delta-proportional (smooth on trackpads;
  // ctrl+wheel = trackpad pinch gesture), zooming around the cursor.
  map.getContainer().addEventListener('wheel', e => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 20 : 1;   // line-mode (Firefox)
    const dz = Math.max(-0.45, Math.min(0.45,
      e.ctrlKey ? -e.deltaY * 0.012 : -e.deltaY * unit / 340));
    map.setZoomAround(map.mouseEventToContainerPoint(e), map.getZoom() + dz, { animate: false });
  }, { passive: false });

  // Tile pyramid: level t covers 2008·2^t × 1920·2^t px (t = 0…3).
  // Retina: fetch one level higher and render at 128 css-px/tile → 1 tile px = 1 device px.
  const retina = (window.devicePixelRatio || 1) > 1.5;
  const common = { bounds: MAP_BOUNDS, noWrap: true, minZoom: -5,
                   keepBuffer: 3, updateWhenZooming: false };
  tileLayer = L.tileLayer(TILE_URL, retina
    ? Object.assign(common, { tileSize: 128, zoomOffset: 1, minNativeZoom: -1, maxNativeZoom: 2 })
    : Object.assign(common, { tileSize: 256, zoomOffset: 0, minNativeZoom: 0,  maxNativeZoom: 3 }));
  tileLayer.addTo(map);
  map.addLayer(worldLayer = new WorldLayer());

  map.on('zoom viewreset zoomend', syncZoomUI);
  map.on('zoomend viewreset', scheduleBake);
  map.on('movestart zoomstart', hideTip);
  map.on('click', hideTip);
  window.addEventListener('resize', () => {
    map.invalidateSize();
    map.setMinZoom(s2l(minZoom()));
    checkLOD();
  });
  // Movement guard for label taps/clicks (replaces old didMove flag)
  document.addEventListener('pointerdown', e => { downXY = { x: e.clientX, y: e.clientY }; }, true);
}

function initialView() {
  const ta = lastData?._meta?.title_area, mz = minZoom();
  if (ta?.tl) {
    const s = Math.max(Z_INIT, mz);
    // title-area top-left pinned at screen (40, 30) — same as before
    const cx = ta.tl.x/100*SVG_W + (window.innerWidth /2 - 40) / s;
    const cy = ta.tl.y/100*SVG_H + (window.innerHeight/2 - 30) / s;
    map.setView([-cy, cx], s2l(s), { animate: false });
  } else {
    map.setView([-SVG_H/2, SVG_W/2], s2l(mz), { animate: false });
  }
  syncZoomUI();
}
function resetView() { initialView(); }

function doZoom(f) {
  map.setZoom(map.getZoom() + s2l(f));
}

/* ═══════════════════════════════════════════════════════════
   UI ACTIONS
═══════════════════════════════════════════════════════════ */
function setupUI() {
  document.addEventListener('keydown', e => {
    if (e.target.tagName==='TEXTAREA') return;

function resetStates() {
  if (!confirm(UI('reset_confirm'))) return;

function toggleLegend() {

async function openShare() {

async function copyShare() {

function showToast(msg) {

}

/* ═══════════════════════════════════════════════════════════
   SHARE ENCODING — 3 bits/item, deflate-raw + base64url
═══════════════════════════════════════════════════════════ */
function pack(sa){const b=new Uint8Array(Math.ceil(sa.length*3/8));for(let i=0;i<sa.length;i++){const s=sa[i]&7,p=i*3,bi=p>>3,bo=p&7;b[bi]|=s<<bo;if(bo>5&&bi+1<b.length)b[bi+1]|=s>>(8-bo);}return b;}
function unpack(b,n){const o=new Uint8Array(n);for(let i=0;i<n;i++){const p=i*3,bi=p>>3,bo=p&7;let v=(b[bi]>>bo)&7;if(bo>5&&bi+1<b.length)v|=(b[bi+1]<<(8-bo))&7;o[i]=Math.min(v,4);}return o;}
async function cmp(d){try{const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(d);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer());}catch{return d;}}
async function dcm(d){try{const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(d);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer());}catch{return d;}}
function b64u(b){let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function db64(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function buildShareURL(){return`${location.origin}${location.pathname}#${VER}${b64u(await cmp(pack(states)))}`;}
async function restoreHash(){
  const h=location.hash.slice(1); if(!h.startsWith(VER)) return;
  try{const r=unpack(await dcm(db64(h.slice(VER.length))),items.length);for(let i=0;i<r.length&&i<states.length;i++)states[i]=r[i];}
  catch(e){console.warn('[Map] hash:',e);}
}

/* ═══════════════════════════════════════════════════════════
   LOAD & INIT
═══════════════════════════════════════════════════════════ */
function loadJSON(url) {
  return new Promise((res,rej) => {
    const x=new XMLHttpRequest(); x.open('GET',url,true); x.responseType='json'; x.timeout=15000;
    x.onload = () => (x.status===200||x.status===0)&&x.response ? res(x.response) : rej(new Error(`HTTP ${x.status} — ${url}`));
    x.onerror   = () => rej(new Error(`Network error — ${url}`));
    x.ontimeout = () => rej(new Error(`Timeout — ${url}`));
    x.send();
  });
}

function showError(msg, detail) {
  G('loading').innerHTML = `
    <div style="color:#e53935;font-size:14px;text-align:center;padding:20px;max-width:420px">
      <div style="font-size:24px;margin-bottom:12px">⚠</div>
      <b>${msg}</b><br>
      <small style="color:#7a6840;display:block;margin-top:8px;line-height:1.6">${detail}</small>
      <small style="color:#5a4820;display:block;margin-top:14px;line-height:1.7">
        必须通过 HTTP 服务器访问：<br>
        <code>python3 -m http.server 8080</code><br>
        然后访问 <a href="http://localhost:8080" style="color:#c8902a">http://localhost:8080</a><br>
        确认 <code>data.json</code>、<code>lang/zh.json</code>、<code>tiles/</code>、<code>leaflet/</code> 都在同一目录
      </small>
    </div>`;
}

async function init() {
  try {
    // Load data.json + default lang (zh) in parallel
    const [mapData, zhLang] = await Promise.all([
      loadJSON(DATA_URL),
      loadJSON(LANG_URL('zh')),
    ]);

    lastData = mapData;
    langCache['zh'] = zhLang;
    langData = zhLang;

    buildItems(mapData);
    states = new Uint8Array(items.length);
    try { await restoreHash(); } catch(e) { console.warn(e); }

    try { buildGeoSVG();         } catch(e) { console.error('[Map] geo:', e); }
    try { buildLabels();         } catch(e) { console.error('[Map] labels:', e); }
    try { setupTitleCard(mapData); } catch(e) { console.error('[Map] title:', e); }

    applyUIStrings();
    setupMap();
    setupUI();
    initialView();
    bake(zoom);            // bake the initial scale so labels/geo render crisp at rest

    // Hide the loader once visible tiles are in (or after a grace timeout)
    let ldHidden = false;
    const hideLoading = () => { if (!ldHidden) { ldHidden = true; G('loading').style.display = 'none'; } };
    tileLayer.once('load', hideLoading);
    setTimeout(hideLoading, 6000);
    console.log(`[Map] OK — ${items.length} items, lang=zh`);
  } catch(e) {
    console.error(e);
    showError('载入失败', e.message);
  }
}

init();
</script>
</body>
</html>
